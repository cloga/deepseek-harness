<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:">
    <title id="page-title"></title>
    <link rel="stylesheet" href="plugin-manager.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1 id="title"></h1>
          <p id="description"></p>
        </div>
        <button id="refresh" class="quiet" type="button"></button>
      </header>
      <section id="recovery" hidden>
        <p id="recovery-description"></p>
        <p id="startup-error" role="alert"></p>
        <button id="retry" type="button"></button>
        <button id="disable-all" type="button"></button>
      </section>
      <form id="install-form">
        <label id="package-label" for="package-spec"></label>
        <div class="install-row">
          <input id="package-spec" name="package-spec" autocomplete="off" aria-describedby="source-help source-build-notice" required>
          <button id="install" type="submit"></button>
        </div>
        <p id="source-help" class="source-help"></p>
        <p id="source-build-notice" class="source-help"></p>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <section aria-labelledby="installed-heading">
        <h2 id="installed-heading"></h2>
        <ul id="plugins"></ul>
        <p id="empty"></p>
      </section>
    </main>
    <dialog id="package-dialog" aria-labelledby="package-dialog-label">
      <form id="package-dialog-form">
        <label id="package-dialog-label" for="package-dialog-input"></label>
        <input id="package-dialog-input" autocomplete="off">
        <div class="dialog-actions">
          <button id="package-dialog-cancel" type="button" class="quiet"></button>
          <button id="package-dialog-confirm" type="submit"></button>
        </div>
      </form>
    </dialog>
    <script src="plugin-manager.js"></script>
  </body>
</html>

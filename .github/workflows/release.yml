# Pack the dsh release sequence: every package under packages/ plus the apps/
# entries, all on one version. The vendored framework and the native packages are
# separate sequences with their own workflows and version lines.
#
# Pack and dependency-layout verification run without credentials on every pull
# request and master push. The opt-in GitHub-only artifact job below publishes
# only the approved existing tag; npm remains owned by release-publish.yml.
name: Release (dsh)

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish_github_artifacts:
        description: 'Publish the approved Core/Web GitHub artifacts (not npm or Desktop)'
        type: boolean
        default: false
      version:
        description: 'Exact approved version; must match the existing dsh-v tag and manifests'
        type: string
      reviewed_head:
        description: 'Full approved final PR 79 head SHA (verified through GitHub reviews)'
        type: string
      merged_commit:
        description: 'Full PR 79 merged SHA (must equal peeled tag and dispatch SHA)'
        type: string
      ci_run_id:
        description: 'Successful final-head PR CI run ID; checkout logs must still exist'
        type: string
      policy_run_id:
        description: 'Successful final-head issue-policy run ID'
        type: string

permissions:
  contents: read

concurrency:
  # Preserve per-ref PR cancellation; a publication is never displaced by a rehearsal or another dispatch.
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_github_artifacts && format('{0}-github-artifacts-{1}', github.workflow, github.run_id) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish_github_artifacts) }}

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'
  RELEASE_PUBLISH: ${{ inputs.publish_github_artifacts }}
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_REVIEWED_HEAD: ${{ inputs.reviewed_head }}
  RELEASE_MERGED_COMMIT: ${{ inputs.merged_commit }}
  RELEASE_CI_RUN: ${{ inputs.ci_run_id }}
  RELEASE_POLICY_RUN: ${{ inputs.policy_run_id }}

jobs:
  dependencies:
    name: Dependency layout
    # Persistent runners accept only trusted, credential-free rehearsals.
    runs-on: >-
      ${{ vars.DSH_CI_FAILOVER_LINUX == 'selfhosted'
        && github.repository == 'deepseek-harness/deepseek-harness'
        && github.actor != 'dependabot[bot]'
        && ((github.event_name == 'push' && github.ref == 'refs/heads/master')
          || (github.event_name == 'pull_request'
            && github.event.pull_request.head.repo.full_name == github.repository
            && github.event.pull_request.head.repo.fork == false
            && github.event.pull_request.user.login != 'dependabot[bot]'))
        && fromJSON('["self-hosted", "linux", "x64", "vm-backup"]')
        || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          clean: true

      - name: Configure runner-private caches
        run: |
          echo "NODE_COMPILE_CACHE=${{ runner.temp }}/node-compile-cache" >> "$GITHUB_ENV"
          echo "npm_config_devdir=${{ runner.temp }}/node-gyp" >> "$GITHUB_ENV"
          echo "TMPDIR=${{ runner.temp }}" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          package-manager-cache: false

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        if: runner.environment == 'github-hosted'
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Guard GitHub artifact dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.publish_github_artifacts
        run: node scripts/release/github-artifacts.ts guard

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Verify dependency policy
        run: pnpm run verify-package-dependencies

      - name: Verify npm install layout
        run: pnpm run verify-npm-install-layout

  pack:
    name: Pack npm tarballs
    outputs:
      artifact-id: ${{ steps.tarballs.outputs.artifact-id }}
    # Persistent runners accept only trusted, credential-free rehearsals.
    runs-on: >-
      ${{ vars.DSH_CI_FAILOVER_LINUX == 'selfhosted'
        && github.repository == 'deepseek-harness/deepseek-harness'
        && github.actor != 'dependabot[bot]'
        && ((github.event_name == 'push' && github.ref == 'refs/heads/master')
          || (github.event_name == 'pull_request'
            && github.event.pull_request.head.repo.full_name == github.repository
            && github.event.pull_request.head.repo.fork == false
            && github.event.pull_request.user.login != 'dependabot[bot]'))
        && fromJSON('["self-hosted", "linux", "x64", "vm-backup"]')
        || 'ubuntu-24.04' }}
    steps:
      # Complete history: the release scripts read tags.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Configure runner-private caches
        run: |
          echo "NODE_COMPILE_CACHE=${{ runner.temp }}/node-compile-cache" >> "$GITHUB_ENV"
          echo "npm_config_devdir=${{ runner.temp }}/node-gyp" >> "$GITHUB_ENV"
          echo "TMPDIR=${{ runner.temp }}" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          package-manager-cache: false

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        if: runner.environment == 'github-hosted'
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Guard GitHub artifact dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.publish_github_artifacts
        run: node scripts/release/github-artifacts.ts guard

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        run: pnpm run release:verify --family dsh

      - name: Build
        run: pnpm run build:official

      # Concurrency here is rehearsal-only: the credentialed publish workflows
      # invoke release:pack without the flag and keep the strictly serial path.
      - name: Pack release tarballs
        run: pnpm run release:pack --family dsh --out dist/npm --concurrency 8

      # The harness packages declare the vendored framework as a peer, and this
      # verification must not depend on the registry already carrying matching
      # versions — one pull request may bump both families before either
      # publishes — so it installs that family's pack output too. Only dist/npm
      # is published.
      - name: Pack the vendored framework for verification
        run: pnpm run release:pack --family vendor --out dist/npm-vendor --concurrency 8

      # dsh-sandbox-local declares the Landlock entry as a runtime dependency, so
      # the verification needs its tarball. Its platform packages stay out: they
      # are optional, and building them needs a musl toolchain per architecture.
      - name: Pack the Landlock entry for verification
        run: |
          pnpm --dir native/system run build:ts
          pnpm --dir native/system/packages/entry pack --pack-destination "$PWD/dist/npm-landlock"

      - name: Verify packed install
        run: pnpm run release:verify-packed-install --family dsh --from dist/npm --from dist/npm-vendor --from dist/npm-landlock

      - name: Seal original GitHub release artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.publish_github_artifacts
        run: node node_modules/tsx/dist/cli.mjs scripts/release/github-artifacts-prepare.ts dist/npm

      - uses: actions/upload-artifact@v4
        id: tarballs
        with:
          name: dsh-npm-tarballs
          path: dist/npm/*
          if-no-files-found: error
          retention-days: 7

  github-artifacts:
    name: Publish Core/Web GitHub artifacts
    needs: [dependencies, pack]
    if: >-
      ${{ success() && github.event_name == 'workflow_dispatch'
        && inputs.publish_github_artifacts && github.repository == 'cloga/deepseek-harness'
        && startsWith(github.ref, 'refs/tags/dsh-v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      checks: read
      pull-requests: read
      statuses: read
    concurrency:
      group: Core-Web-GitHub-artifacts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          clean: true
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.pack.outputs.artifact-id }}
          path: ${{ runner.temp }}/github-artifacts
          merge-multiple: true
      - name: Verify evidence and publish original artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT_ID: ${{ needs.pack.outputs.artifact-id }}
        run: node scripts/release/github-artifacts.ts publish "$RUNNER_TEMP/github-artifacts" "$RUNNER_TEMP/github-artifact-write-journal.jsonl"
      - name: Retain write journal for reconciliation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-artifact-write-journal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/github-artifact-write-journal.jsonl
          if-no-files-found: warn
          retention-days: 90

name: Desktop fork release (Windows x64)

on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: Exact reviewed version from apps/desktop/release/cloga-windows-x64.json
        required: true
        type: string
      expected_source_sha:
        description: Exact reviewed source commit (40 lowercase hexadecimal characters)
        required: true
        type: string
      rehearsal:
        description: Build and retain reviewed branch artifacts without publishing a release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ inputs.rehearsal && format('desktop-fork-rehearsal-{0}', github.ref) || 'desktop-fork-release' }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24.13.0'
  PNPM_VERSION: '11.7.0'
  DSH_TELEMETRY_DISABLED: '1'
  RELEASE_PLAN: apps/desktop/release/cloga-windows-x64.json
  CAPABILITY_PATH: apps/desktop/.desktop-build/fork-release/capability.json
  PROVISIONING_PATH: apps/desktop/.desktop-build/fork-release/provisioning.json
  RELEASE_ASSETS: dist/desktop-fork-release

jobs:
  build:
    name: Build unsigned fork installer
    if: github.ref == 'refs/heads/master' || inputs.rehearsal
    runs-on: windows-2025
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      asset_set_sha256: ${{ steps.asset-set.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Require current reviewed ref and version
        id: plan
        shell: pwsh
        env:
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          REHEARSAL: ${{ inputs.rehearsal }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EXPECTED_SOURCE_SHA -cnotmatch '\A[0-9a-f]{40}\z') {
            throw 'Expected source SHA must be exactly 40 lowercase hexadecimal characters'
          }
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the checked-out source commit' }
          if ($head -cne $env:EXPECTED_SOURCE_SHA) {
            throw "Checkout does not match reviewed source: HEAD=$head expected=$($env:EXPECTED_SOURCE_SHA)"
          }
          if ($env:REHEARSAL -eq 'true') {
            if ($env:GITHUB_REF_TYPE -ne 'branch') { throw 'Rehearsal must run from a branch' }
            $selectedRef = 'refs/remotes/rehearsal/selected'
            git fetch --no-tags origin "refs/heads/$($env:GITHUB_REF_NAME):$selectedRef"
            if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the current rehearsal branch' }
            $selected = git rev-parse $selectedRef
            if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the current rehearsal branch' }
            if ($head -ne $selected) {
              throw "Rehearsal must run from the current selected branch: HEAD=$head origin/$($env:GITHUB_REF_NAME)=$selected"
            }
          } else {
            if ($env:GITHUB_REF -ne 'refs/heads/master') { throw 'Release must run from master' }
            git fetch --no-tags origin master
            if ($LASTEXITCODE -ne 0) { throw 'Could not fetch current master' }
            $master = git rev-parse origin/master
            if ($LASTEXITCODE -ne 0) { throw 'Could not resolve current master' }
            if ($head -ne $master) { throw "Release must run from current master: HEAD=$head origin/master=$master" }
          }
          $plan = Get-Content -LiteralPath $env:RELEASE_PLAN -Raw | ConvertFrom-Json
          if ($env:CONFIRM_VERSION -ne $plan.version) {
            throw "Confirmation version does not match reviewed plan version $($plan.version)"
          }
          "version=$($plan.version)" >> $env:GITHUB_OUTPUT
          "tag=dsh-desktop-v$($plan.version)" >> $env:GITHUB_OUTPUT
          "source_sha=$head" >> $env:GITHUB_OUTPUT

      - name: Install from frozen lockfile
        run: pnpm install --frozen-lockfile

      # These guards consume source fixtures, not built application artifacts.
      - name: Verify installer-upgrade guard tests
        shell: pwsh
        run: |
          node --test apps/desktop/tests/windows-installed-upgrade.test.mjs apps/desktop/tests/windows-packaged-package-acceptance.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare browser for isolated Desktop acceptance
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/desktop-playwright
        run: node apps/desktop/node_modules/playwright/cli.js install chromium

      - name: Verify Desktop test collection
        run: node apps/desktop/scripts/verify-release-test-collection.mjs

      - name: Verify packaged skill canary guards
        shell: pwsh
        run: |
          node --test apps/desktop/tests/packaged-skills-smoke.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Desktop release code
        run: pnpm exec vitest run apps/desktop apps/desktop-host --config=vitest.desktop-release.config.ts --maxWorkers=1

      # The transaction fixture launches real Node children; match its Windows coverage test/hook budget.
      # Other Desktop tests retain their existing default budgets, and each file runs in exactly one step.
      - name: Verify Desktop project transactions
        run: >-
          pnpm exec vitest run apps/desktop/tests/project-manager.spec.ts
          --maxWorkers=1 --testTimeout=90000 --hookTimeout=90000

      - name: Verify hidden Windows command paths
        run: >-
          pnpm exec vitest run
          packages/subprocess/win32-process/tests
          packages/subprocess/subprocess-local/tests/windows-job.spec.ts
          packages/subprocess/subprocess-local/tests/native-windows.spec.ts
          packages/sandbox/sandbox-windows-acl/tests/runner.spec.ts
          packages/sandbox/sandbox-windows-acl/tests/provider-chain.spec.ts
          packages/sandbox/sandbox-windows-acl/tests/control.spec.ts
          --maxWorkers=2 --testTimeout=90000 --hookTimeout=90000

      - name: Prepare reviewed managed capability
        env:
          DSH_DESKTOP_RELEASE_GITHUB_TOKEN: ${{ github.token }}
        run: >-
          pnpm exec tsx apps/desktop/scripts/fork-release.ts prepare
          --plan ${{ env.RELEASE_PLAN }}
          --out ${{ env.CAPABILITY_PATH }}
          --provisioning ${{ env.PROVISIONING_PATH }}
          --remote

      - name: Build unsigned interactive NSIS installer
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/desktop-playwright
          DSH_DESKTOP_APP_ID: io.github.cloga.deepseek-harness.desktop
          DSH_DESKTOP_FORK_RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          DSH_DESKTOP_MANAGED_UPDATE_CAPABILITY: ${{ github.workspace }}\${{ env.CAPABILITY_PATH }}
          DSH_DESKTOP_PLUGIN_PROVISIONING_PLAN: ${{ github.workspace }}\${{ env.PROVISIONING_PATH }}
        run: pnpm run package:desktop:win:x64:unsigned

      - name: Verify ASAR runtime inventory canaries with packaged Electron
        run: >-
          node apps/desktop/tests/fixtures/packaged-runtime-smoke.mjs
          apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/win-unpacked/cloga-deepseek-harness.exe

      - name: Verify copied helper bootstrap and acknowledgement
        run: >-
          pnpm exec tsx apps/desktop/scripts/smoke-helper.ts
          --node apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/win-unpacked/resources/runtime/primary-runtime/dependencies/node/bin/node.exe
          --helper apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/win-unpacked/resources/managed-update/helper.mjs
          --capability apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/win-unpacked/resources/managed-update/capability.json
          --output dist/desktop-copilot-acceptance

      - name: Verify packaged Copilot account and restart
        id: copilot_acceptance
        run: >-
          pnpm exec tsx apps/desktop/tests/fixtures/copilot-release-smoke.ts
          --application apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/win-unpacked/cloga-deepseek-harness.exe
          --output dist/desktop-copilot-acceptance

      - name: Verify real acceptance observer failure cleanup
        id: observer_cleanup
        run: >-
          pnpm exec tsx apps/desktop/tests/fixtures/copilot-release-smoke.ts --observer-cleanup-canary
          --application apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/win-unpacked/cloga-deepseek-harness.exe
          --output dist/desktop-copilot-observer-canary

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && (steps.observer_cleanup.outcome == 'success' || steps.observer_cleanup.outcome == 'failure') }}
        with:
          name: desktop-copilot-observer-canary-${{ steps.plan.outputs.version }}
          path: dist/desktop-copilot-observer-canary/*
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && (steps.copilot_acceptance.outcome == 'success' || steps.copilot_acceptance.outcome == 'failure') }}
        with:
          name: desktop-copilot-acceptance-${{ steps.plan.outputs.version }}
          path: dist/desktop-copilot-acceptance/*
          if-no-files-found: error
          retention-days: 7

      - name: Finalize release manifest and receipts
        run: >-
          pnpm exec tsx apps/desktop/scripts/fork-release.ts finalize
          --plan ${{ env.RELEASE_PLAN }}
          --capability ${{ env.CAPABILITY_PATH }}
          --provisioning ${{ env.PROVISIONING_PATH }}
          --artifacts apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts
          --out ${{ env.RELEASE_ASSETS }}

      # Internal diagnostic bytes only: never consumed by the protected publisher.
      # Retaining them avoids rebuilding an identical candidate merely to investigate fixture/native UI failures.
      - name: Retain unqualified rehearsal candidate for targeted diagnosis
        if: ${{ inputs.rehearsal }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-unqualified-candidate-${{ steps.plan.outputs.version }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.RELEASE_ASSETS }}/*
          if-no-files-found: error
          retention-days: 7

      - name: Acquire the verified installer-upgrade baseline
        id: upgrade_baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_OS -ne 'Windows') {
            throw 'Installer acquisition is restricted to the disposable Windows runner'
          }
          $baseline = Get-Content -LiteralPath apps/desktop/tests/fixtures/windows-upgrade-baseline.json -Raw | ConvertFrom-Json
          if ($baseline.repository -cne 'cloga/deepseek-harness') { throw 'Unexpected baseline repository' }
          $raw = & gh api "repos/cloga/deepseek-harness/releases/$($baseline.releaseId)"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read baseline release metadata' }
          $release = $raw | ConvertFrom-Json
          if ($release.id -ne $baseline.releaseId -or $release.tag_name -cne $baseline.tag `
              -or $release.target_commitish -isnot [string] -or $release.target_commitish -cnotmatch '^[a-f0-9]{40}$' `
              -or $release.immutable -isnot [bool] -or $release.immutable -ne $true `
              -or $release.draft -isnot [bool] -or $release.draft -ne $false) {
            throw 'Baseline release does not match the reviewed immutable identity'
          }
          $tagSha = & gh api "repos/cloga/deepseek-harness/git/ref/tags/$($baseline.tag)" --jq .object.sha
          if ($LASTEXITCODE -ne 0 -or $tagSha -cne $release.target_commitish) { throw 'Baseline tag target differs' }
          foreach ($expected in @($baseline.manifest, $baseline.installer)) {
            $assets = @($release.assets | Where-Object { $_.name -ceq $expected.file })
            if ($assets.Count -ne 1 -or $assets[0].id -ne $expected.assetId `
                -or $assets[0].state -cne 'uploaded' -or $assets[0].size -ne $expected.bytes `
                -or $assets[0].digest -cne "sha256:$($expected.sha256)") {
              throw 'Baseline asset metadata differs from the reviewed identity'
            }
          }
          $destination = Join-Path $env:RUNNER_TEMP "desktop-upgrade-baseline-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $destination) { throw 'Baseline acquisition directory must be new' }
          New-Item -ItemType Directory -Path $destination | Out-Null
          & gh release download $baseline.tag --repo cloga/deepseek-harness `
            --pattern $baseline.manifest.file --pattern $baseline.installer.file --pattern build-receipt.json --dir $destination
          if ($LASTEXITCODE -ne 0) { throw 'Baseline asset download failed' }
          foreach ($expected in @($baseline.manifest, $baseline.installer)) {
            $path = Join-Path $destination $expected.file
            if ((Get-Item -LiteralPath $path).Length -ne $expected.bytes `
                -or (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected.sha256) {
              throw 'Baseline downloaded bytes differ from the reviewed asset'
            }
          }
          $manifestBytes = [IO.File]::ReadAllBytes((Join-Path $destination $baseline.manifest.file))
          $manifestDigest = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($manifestBytes)).ToLowerInvariant()
          if ($manifestDigest -cne $baseline.manifest.sha256) { throw 'Pinned baseline manifest changed' }
          $manifest = [Text.Encoding]::UTF8.GetString($manifestBytes) | ConvertFrom-Json
          if ($manifest.source.repository -cne $baseline.repository -or $manifest.source.tag -cne $baseline.tag `
              -or $manifest.source.commit -cne $release.target_commitish -or $manifest.source.commit -cne $tagSha) {
            throw 'Baseline source identity differs from the independently pinned manifest'
          }
          if ($manifest.buildReceipt.file -cne 'build-receipt.json') { throw 'Unexpected baseline receipt filename' }
          $receiptHash = (Get-FileHash -LiteralPath (Join-Path $destination 'build-receipt.json') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($receiptHash -cne $manifest.buildReceipt.sha256) { throw 'Baseline receipt bytes differ' }
          [ordered]@{
            schemaVersion = 1; releaseId = $release.id; immutable = $release.immutable
            tag = $release.tag_name; sourceCommit = $release.target_commitish
            manifestSha256 = $baseline.manifest.sha256; installerSha256 = $baseline.installer.sha256
            receiptSha256 = $receiptHash; installerExecuted = $false
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $destination 'acquisition.json') -Encoding utf8NoBOM

      - name: Verify real installed Desktop upgrade
        id: installed_upgrade
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./apps/desktop/tests/windows-installer-upgrade.ps1 `
            -BaselineDirectory (Join-Path $env:RUNNER_TEMP "desktop-upgrade-baseline-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT") `
            -CandidateDirectory (Join-Path $env:GITHUB_WORKSPACE $env:RELEASE_ASSETS) `
            -ExpectedSourceCommit $env:GITHUB_SHA `
            -RunRoot (Join-Path $env:RUNNER_TEMP "cloga-installer-upgrade-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && (steps.installed_upgrade.outcome == 'success' || steps.installed_upgrade.outcome == 'failure') }}
        with:
          name: desktop-installer-upgrade-${{ steps.plan.outputs.version }}
          path: |
            ${{ runner.temp }}/cloga-installer-upgrade-${{ github.run_id }}-${{ github.run_attempt }}/evidence/*
            ${{ runner.temp }}/desktop-upgrade-baseline-${{ github.run_id }}-${{ github.run_attempt }}/acquisition.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify complete release qualification
        id: qualification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm exec tsx apps/desktop/scripts/verify-fork-qualification.ts `
            --plan $env:RELEASE_PLAN `
            --release-assets $env:RELEASE_ASSETS `
            --ordinary-evidence dist/desktop-copilot-acceptance `
            --packaged-evidence dist/desktop-copilot-observer-canary `
            --upgrade-root (Join-Path $env:RUNNER_TEMP "cloga-installer-upgrade-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT") `
            --baseline-directory (Join-Path $env:RUNNER_TEMP "desktop-upgrade-baseline-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT") `
            --expected-source $env:GITHUB_SHA `
            --run-id $env:GITHUB_RUN_ID `
            --run-attempt $env:GITHUB_RUN_ATTEMPT `
            --output dist/desktop-fork-qualification/qualification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Retain verified internal qualification summary
        uses: actions/upload-artifact@v4
        with:
          name: desktop-fork-qualification-${{ steps.plan.outputs.version }}-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/desktop-fork-qualification/qualification.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify release asset checksums
        id: asset-set
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location $env:RELEASE_ASSETS
          try {
            foreach ($line in Get-Content -LiteralPath SHA256SUMS) {
              $hash, $name = $line -split '  ', 2
              if ((Get-FileHash -LiteralPath $name -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) {
                throw "SHA-256 mismatch for $name"
              }
            }
            foreach ($line in Get-Content -LiteralPath SHA512SUMS) {
              $hash, $name = $line -split '  ', 2
              $actual = [Convert]::ToBase64String([Security.Cryptography.SHA512]::HashData(
                [IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $name))))
              if ($actual -ne $hash) { throw "SHA-512 mismatch for $name" }
            }
            $inventory = Get-ChildItem -File | Sort-Object Name | ForEach-Object {
              "$($_.Name):$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
            }
            $bytes = [Text.Encoding]::UTF8.GetBytes(($inventory -join "`n"))
            $setHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
            "sha256=$setHash" >> $env:GITHUB_OUTPUT
          } finally {
            Pop-Location
          }

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-fork-release-${{ steps.plan.outputs.version }}
          path: ${{ env.RELEASE_ASSETS }}/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish immutable GitHub Release
    needs: build
    if: ${{ !inputs.rehearsal && github.ref == 'refs/heads/master' }}
    runs-on: windows-2025
    environment: desktop-fork-release
    permissions:
      actions: read
      contents: write
    outputs:
      release_url: ${{ steps.publish.outputs.release_url }}
      manifest_url: ${{ steps.publish.outputs.manifest_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          persist-credentials: false
          clean: true

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - uses: actions/download-artifact@v4
        with:
          name: desktop-fork-release-${{ needs.build.outputs.version }}
          path: release-assets

      - name: Cross-check downloaded artifact set
        shell: pwsh
        env:
          EXPECTED_SET_SHA256: ${{ needs.build.outputs.asset_set_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $inventory = Get-ChildItem -LiteralPath release-assets -File | Sort-Object Name | ForEach-Object {
            "$($_.Name):$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
          }
          $bytes = [Text.Encoding]::UTF8.GetBytes(($inventory -join "`n"))
          $actual = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_SET_SHA256) { throw 'Downloaded artifact set does not match the build job' }

      - name: Publish reviewed release
        id: publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:SOURCE_SHA) { throw 'Publisher checkout differs from the reviewed build source' }
          node apps/desktop/scripts/publish-fork-release.mjs release-assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  remote-check:
    name: Verify remote managed Check
    needs: [build, release]
    if: ${{ !inputs.rehearsal && github.ref == 'refs/heads/master' }}
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          persist-credentials: false
          clean: true

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run the shipped source discovery against GitHub
        env:
          DSH_DESKTOP_RELEASE_GITHUB_TOKEN: ${{ github.token }}
        run: >-
          pnpm exec tsx apps/desktop/scripts/fork-release.ts verify-remote
          --plan ${{ env.RELEASE_PLAN }}

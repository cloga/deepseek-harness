name: weighted-approval-review-event
run-name: weighted-approval-review-event:${{ github.event.pull_request.number }}

on:
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

jobs:
  record-review-event:
    if: github.event.pull_request.state == 'open'
    name: record weighted approval review event
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Skip weighted approval outside canonical upstream
        if: github.repository != 'deepseek-ai/deepseek-harness'
        run: echo 'Weighted approval is owned by the canonical upstream repository.'
      - name: Record review event
        if: github.repository == 'deepseek-ai/deepseek-harness'
        run: echo 'Recorded a weighted approval review event.'

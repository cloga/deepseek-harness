name: Scoped alpha2 plugin configuration golden qualification

on:
  push:
    branches:
      - cloga-alpha2-config-golden

permissions:
  contents: read

concurrency:
  group: cloga-alpha2-config-golden
  cancel-in-progress: false

jobs:
  qualify:
    if: github.repository == 'cloga/deepseek-harness' && github.ref == 'refs/heads/cloga-alpha2-config-golden' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_SOURCE_SHA: ${{ github.sha }}
      DSH_OXLINT_THREADS: '2'
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - name: Require the exact branch push and first attempt
        run: |
          test "$GITHUB_REPOSITORY" = 'cloga/deepseek-harness'
          test "$GITHUB_REF" = 'refs/heads/cloga-alpha2-config-golden'
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$EXPECTED_SOURCE_SHA" = "$GITHUB_SHA"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Use runner-owned scratch environment
        run: |
          echo "NODE_COMPILE_CACHE=$RUNNER_TEMP/alpha2-node-cache" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/alpha2-browsers" >> "$GITHUB_ENV"
      - name: Validate capture controls and exact source
        run: |
          node scripts/alpha2-ui-qualification.mjs self-test
          node scripts/alpha2-ui-qualification.mjs before "$RUNNER_TEMP/alpha2-ui-capture"
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/alpha2-pnpm
      - name: Install normal frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Install isolated Chromium and system dependencies
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium
      - name: Build normal source
        run: pnpm run build
      - name: Check changed lifecycle and shared UI behavior
        run: >-
          pnpm exec vitest run
          apps/desktop/tests/main-startup.spec.ts
          apps/desktop/tests/managed-update-launcher.spec.ts
          apps/desktop/tests/profile-package-activation.spec.ts
          apps/desktop/tests/update-input-guard.spec.ts
          apps/desktop/tests/host-process.spec.ts
          apps/desktop/tests/fork-release.spec.ts
          apps/desktop/tests/copilot-settings-smoke.spec.ts
          packages/client/ui-plugin-manager/tests
      - name: Check normal typed lint
        run: pnpm run lint:contracts-ready
      - name: Generate only the official namespace browser golden
        env:
          DSH_SNAPSHOT: refresh
        run: >-
          pnpm exec vitest run --config vitest.web.config.ts apps/web/tests/plugin-config.e2e.ts
          -t 'lists one official page per exposed host-plane namespace after the official bundles'
      - name: Replay plugin configuration, manager, and cancellation scenarios
        env:
          DSH_SNAPSHOT: replay
        run: >-
          pnpm exec vitest run --config vitest.web.config.ts
          apps/web/tests/plugin-config.e2e.ts
          apps/web/tests/plugin-manager.e2e.ts
          apps/web/tests/plugin-install-cancel.e2e.ts
      - name: Verify exact input preservation and capture allowlisted output
        id: capture
        run: node scripts/alpha2-ui-qualification.mjs after "$RUNNER_TEMP/alpha2-ui-capture"
      - name: Preserve bounded qualification evidence
        if: success() && steps.capture.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: alpha2-config-golden-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/alpha2-ui-capture/before.json
            ${{ runner.temp }}/alpha2-ui-capture/qualified.json
            ${{ runner.temp }}/alpha2-ui-capture/goldens/apps/web/tests/expected/plugin-config/official.expected.md
          if-no-files-found: error
          retention-days: 7

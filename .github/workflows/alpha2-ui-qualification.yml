name: Scoped alpha2 UI qualification

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact reviewed temporary qualification commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloga-alpha2-ui-qualification
  cancel-in-progress: false

jobs:
  qualify:
    if: github.repository == 'cloga/deepseek-harness' && startsWith(github.ref, 'refs/heads/cloga-')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      NODE_COMPILE_CACHE: ${{ runner.temp }}/alpha2-node-cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/alpha2-browsers
      DSH_OXLINT_THREADS: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate capture controls and exact source
        run: |
          node scripts/alpha2-ui-qualification.mjs self-test
          node scripts/alpha2-ui-qualification.mjs before "$RUNNER_TEMP/alpha2-ui-capture"
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/alpha2-pnpm
      - name: Install normal frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Install isolated Chromium and system dependencies
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium
      - name: Build normal source
        run: pnpm run build
      - name: Check changed lifecycle and shared UI behavior
        run: >-
          pnpm exec vitest run
          apps/desktop/tests/main-startup.spec.ts
          apps/desktop/tests/managed-update-launcher.spec.ts
          apps/desktop/tests/profile-package-activation.spec.ts
          apps/desktop/tests/update-input-guard.spec.ts
          apps/desktop/tests/host-process.spec.ts
          apps/desktop/tests/fork-release.spec.ts
          apps/desktop/tests/copilot-settings-smoke.spec.ts
          packages/client/ui-plugin-manager/tests
      - name: Check normal typed lint
        run: pnpm run lint:contracts-ready
      - name: Generate only the two Plugin Manager browser goldens
        env:
          DSH_SNAPSHOT: refresh
        run: pnpm exec vitest run --config vitest.web.config.ts apps/web/tests/plugin-manager.e2e.ts
      - name: Replay generated browser snapshots and cancellation scenario
        env:
          DSH_SNAPSHOT: replay
        run: pnpm exec vitest run --config vitest.web.config.ts apps/web/tests/plugin-manager.e2e.ts apps/web/tests/plugin-install-cancel.e2e.ts
      - name: Verify exact input preservation and capture allowlisted outputs
        id: capture
        run: node scripts/alpha2-ui-qualification.mjs after "$RUNNER_TEMP/alpha2-ui-capture"
      - name: Preserve bounded qualification evidence
        if: success() && steps.capture.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: alpha2-ui-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/alpha2-ui-capture/before.json
            ${{ runner.temp }}/alpha2-ui-capture/qualified.json
            ${{ runner.temp }}/alpha2-ui-capture/goldens/apps/web/tests/expected/plugin-manager/manager.expected.md
            ${{ runner.temp }}/alpha2-ui-capture/goldens/apps/web/tests/expected/plugin-manager/live-enabled.expected.md
          if-no-files-found: error
          retention-days: 7

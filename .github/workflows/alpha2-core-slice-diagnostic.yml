name: Alpha2 Core source slice diagnostic (internal only)

on:
  push:
    branches: [cloga-alpha2-core-desktop-67]

permissions:
  contents: read

jobs:
  source-only:
    name: Boot, Web carrier and Desktop Host focused tests
    if: github.repository == 'cloga/deepseek-harness' && github.ref == 'refs/heads/cloga-alpha2-core-desktop-67'
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Require exact current task branch before installing dependencies
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EXPECTED_SOURCE -cnotmatch '\A[a-f0-9]{40}\z') { throw 'Invalid reviewed source SHA' }
          if ($env:GITHUB_SHA -cne $env:EXPECTED_SOURCE) { throw 'Workflow source differs from reviewed push' }
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:EXPECTED_SOURCE) { throw 'Checkout differs from reviewed source' }
          $selected = 'refs/remotes/alpha2-source/current'
          git fetch --no-tags origin "refs/heads/$($env:GITHUB_REF_NAME):$selected"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch current task branch without changing credentials' }
          $selectedHead = git rev-parse $selected
          if ($LASTEXITCODE -ne 0 -or $selectedHead -cne $head) { throw 'Task branch moved after review' }
          $dirty = git status --porcelain=v1 --untracked-files=all
          if ($LASTEXITCODE -ne 0 -or $dirty) { throw 'Diagnostic checkout is not clean' }

      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
          dest: ${{ runner.temp }}/alpha2-source-pnpm
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24.13.0'
          package-manager-cache: false

      - name: Install exact frozen dependencies without a release credential
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build source Host entries for official alpha2 packages, never an installer
        run: |
          pnpm run build:lib:host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test only the reviewed source contracts, never package or publish
        run: |
          pnpm exec vitest run `
            packages/boot/app-boot/tests/profile-pending-package.spec.ts `
            packages/boot/app-boot/tests/profile-package-lease.spec.ts `
            packages/boot/app-boot/tests/package-types.spec.ts `
            packages/boot/app-boot/tests/profile-plugins.spec.ts `
            packages/boot/app-boot/tests/profile-sanitize.spec.ts `
            packages/boot/app-boot/tests/profile-context.spec.ts `
            packages/boot/app-boot/tests/profile-root.spec.ts `
            packages/boot/app-boot/tests/profile.spec.ts `
            packages/boot/app-boot/tests/user-patches.spec.ts `
            packages/boot/app-boot/tests/watch-config.spec.ts `
            packages/boot/hmr/tests/coordination.spec.ts `
            packages/boot/hmr/tests/error.spec.ts `
            packages/boot/hmr/tests/modules.spec.ts `
            packages/boot/hmr/tests/profile.spec.ts `
            packages/boot/hmr/tests/reconciliation.spec.ts `
            packages/boot/hmr/tests/watch-config.spec.ts `
            packages/boot/plugin-manager/tests/build-approval.spec.ts `
            packages/boot/plugin-manager/tests/install-spec.spec.ts `
            packages/boot/plugin-manager/tests/operations.spec.ts `
            packages/boot/plugin-manager/tests/patch.spec.ts `
            packages/boot/plugin-manager/tests/tools.spec.ts `
            packages/host/plugin-inventory/tests/inventory.spec.ts `
            packages/skill/skill-office/tests/skill-office.spec.ts `
            packages/util/lazy-require/tests/index.spec.ts `
            packages/deliverables/workspace-changes/tests/capture.spec.ts `
            packages/deliverables/workspace-changes/tests/compare.spec.ts `
            packages/deliverables/workspace-changes/tests/git.spec.ts `
            packages/deliverables/workspace-changes/tests/git-truncation.spec.ts `
            packages/deliverables/workspace-changes/tests/loader-composition.spec.ts `
            packages/deliverables/workspace-changes/tests/numstat.spec.ts `
            packages/deliverables/workspace-changes/tests/paths.spec.ts `
            apps/desktop-host/tests/package-transactions.spec.ts `
            apps/desktop-host/tests/package-health.spec.ts `
            apps/desktop-host/tests/desktop-plugin-command-ipc.spec.ts `
            apps/desktop-host/tests/desktop-plugin-command-runtime.spec.ts `
            apps/desktop-host/tests/update-impact.spec.ts `
            apps/desktop-host/tests/update-task-control.spec.ts `
            apps/cli/tests/resolved-profile-boot.spec.ts `
            apps/cli/tests/resolved-profile-disposal.spec.ts `
            apps/cli/tests/profile-ownership.spec.ts `
            apps/cli/tests/profile-hmr.spec.ts `
            apps/desktop/tests/fork-release.spec.ts `
            apps/desktop/tests/web-document.spec.ts `
            apps/web/tests/desktop-boot.spec.ts `
            apps/web/tests/injection-order.spec.ts `
            packages/api/gateway/tests/gateway.client.spec.ts `
            packages/api/remotes/tests/remote-events.host.spec.ts `
            packages/client/connection/tests/node-half.host.spec.ts `
            --maxWorkers=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Client face and verify official browser and Manager UI exports, never an installer
        run: |
          pnpm run build:lib:client
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path packages/client/ui-sidebar-browser/lib/client.js)) {
            throw 'Official Sidebar Browser client export missing from source build'
          }
          if (!(Test-Path packages/client/ui-plugin-manager/lib/client.js)) {
            throw 'Official Manager UI client export missing from source build'
          }

      - name: Test official browser, Manager UI and terminal components without mounting Desktop
        run: |
          pnpm exec vitest run `
            packages/client/ui-sidebar-browser/tests/apply.client.spec.ts `
            packages/client/ui-sidebar-browser/tests/browser-body.client.spec.tsx `
            packages/client/ui-sidebar-browser/tests/browser-controller.client.spec.ts `
            packages/client/ui-sidebar-browser/tests/browser-frame.client.spec.ts `
            packages/client/ui-sidebar-browser/tests/browser-navigation.client.spec.ts `
            packages/client/ui-sidebar-browser/tests/browser-title.client.spec.tsx `
            packages/client/ui-sidebar-browser/tests/store.client.spec.ts `
            packages/client/ui-sidebar-browser/tests/url.client.spec.ts `
            packages/client/ui-plugin-manager/tests/browser-plugin.client.spec.tsx `
            packages/client/ui-plugin-manager/tests/components.client.spec.tsx `
            packages/client/ui-plugin-manager/tests/config-ledger.client.spec.ts `
            packages/client/ui-plugin-manager/tests/manager-store.client.spec.ts `
            packages/client/ui-primitives/tests/terminal-block.client.spec.tsx `
            packages/client/ui-tool/tests/terminal-card.client.spec.tsx `
            --maxWorkers=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test all official named-profile Manager cases and staged no-write refusal
        run: |
          pnpm exec vitest run packages/boot/plugin-manager/tests/manager.spec.ts --maxWorkers=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test all official workspace recorder integration cases in one fresh worker
        run: |
          pnpm exec vitest run packages/deliverables/workspace-changes/tests/plugin.spec.ts --maxWorkers=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test the same maintained Desktop project-manager suite in its own bounded worker
        run: |
          pnpm exec vitest run apps/desktop/tests/project-manager.spec.ts --maxWorkers=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

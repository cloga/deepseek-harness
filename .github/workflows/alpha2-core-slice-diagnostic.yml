name: Alpha2 Core source slice diagnostic (internal only)

on:
  push:
    branches: [cloga-alpha2-core-desktop-67]

permissions:
  contents: read

jobs:
  source-only:
    name: Boot, Web carrier and Desktop Host focused tests
    if: github.repository == 'cloga/deepseek-harness' && github.ref == 'refs/heads/cloga-alpha2-core-desktop-67'
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Require exact current task branch before installing dependencies
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EXPECTED_SOURCE -cnotmatch '\A[a-f0-9]{40}\z') { throw 'Invalid reviewed source SHA' }
          if ($env:GITHUB_SHA -cne $env:EXPECTED_SOURCE) { throw 'Workflow source differs from reviewed push' }
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:EXPECTED_SOURCE) { throw 'Checkout differs from reviewed source' }
          $selected = 'refs/remotes/alpha2-source/current'
          git fetch --no-tags origin "refs/heads/$($env:GITHUB_REF_NAME):$selected"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch current task branch without changing credentials' }
          $selectedHead = git rev-parse $selected
          if ($LASTEXITCODE -ne 0 -or $selectedHead -cne $head) { throw 'Task branch moved after review' }
          $dirty = git status --porcelain=v1 --untracked-files=all
          if ($LASTEXITCODE -ne 0 -or $dirty) { throw 'Diagnostic checkout is not clean' }

      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
          dest: ${{ runner.temp }}/alpha2-source-pnpm
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24.13.0'
          package-manager-cache: false

      - name: Install exact frozen dependencies without a release credential
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The PDF.js license test packs the built package with the pinned pnpm
          # Node entry, not a shell-launched .cmd or an ambient PATH executable.
          if ([string]::IsNullOrWhiteSpace($env:PNPM_HOME)) { throw 'Pinned pnpm action did not set PNPM_HOME' }
          $packagePath = Join-Path (Split-Path -Parent $env:PNPM_HOME) 'pnpm/package.json'
          if (!(Test-Path -LiteralPath $packagePath)) { throw 'Pinned pnpm package manifest is unavailable' }
          $pnpmManifest = Get-Content -LiteralPath $packagePath -Raw | ConvertFrom-Json
          $bin = $pnpmManifest.bin.pnpm
          if ($pnpmManifest.name -cne 'pnpm' -or $pnpmManifest.version -cne '11.7.0' -or $bin -cnotmatch '^bin/pnpm\.[cm]?js$') { throw 'Pinned pnpm Node entry metadata differs from this workflow' }
          $nodeEntry = Join-Path (Split-Path -Parent $packagePath) $bin
          if (!(Test-Path -LiteralPath $nodeEntry)) { throw 'Pinned pnpm Node entry is missing' }
          $actual = & node $nodeEntry --version
          if ($LASTEXITCODE -ne 0 -or ($actual -join '').Trim() -cne '11.7.0') { throw 'Pinned pnpm Node entry version differs' }
          "DSH_PINNED_PNPM_ENTRY=$nodeEntry" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Generate Office license notices from the exact frozen Kit for source review
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (git status --porcelain=v1 --untracked-files=all) { throw 'Frozen install modified the reviewed checkout' }
          pnpm exec tsx scripts/gen-third-party-notices.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changed = @(git diff --name-only)
          if ($changed.Count -gt 1 -or ($changed.Count -eq 1 -and $changed[0] -cne 'THIRD_PARTY_NOTICES.md')) {
            throw 'Notice generation changed files outside its owned artifact'
          }
          $notices = Get-Content -LiteralPath THIRD_PARTY_NOTICES.md -Raw
          if (!$notices.Contains('## Independently published LibreOffice kit')) {
            throw 'Declared Office Kit MPL source obligations missing from generated notices'
          }
          $hash = (Get-FileHash THIRD_PARTY_NOTICES.md -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'alpha2-office-notices.sha256') -Value $hash -NoNewline
          Write-Output "source=$env:EXPECTED_SOURCE officeNoticesSha256=$hash"

      - uses: actions/upload-artifact@v4
        with:
          name: alpha2-office-notices-${{ github.sha }}
          path: THIRD_PARTY_NOTICES.md
          retention-days: 7
          if-no-files-found: error

      - name: Build dormant Host entry and inspect nonpublishing CLI/Host tars, never an installer
        run: |
          pnpm run build:lib:host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($file in @('apps/cli/lib/bin.js', 'apps/cli/lib/profile-boot.js',
            'apps/cli/lib/types/profile-boot.d.ts', 'apps/desktop-host/lib/index.js',
            'apps/desktop-host/lib/alpha2-entry.js',
            'packages/document/office-to-pdf/lib/index.js',
            'packages/document/office-to-pdf/lib/typert.remote-client.js')) {
            if (!(Test-Path $file)) { throw "Missing exact-source entry: $file" }
          }
          Push-Location apps/desktop-host
          try {
            node --input-type=module -e "import { runProfile } from '@deepseek-ai/dsh/profile-boot'; if (typeof runProfile !== 'function') process.exit(2)"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --input-type=module -e "const m = await import('./lib/alpha2-entry.js'); if (typeof m.runAlpha2DesktopHost !== 'function') process.exit(2)"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --input-type=module -e "if (!import.meta.resolve('@deepseek-ai/dsh/lib/bin.js').endsWith('/lib/bin.js')) process.exit(2)"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
          $packDir = Join-Path $env:RUNNER_TEMP 'alpha2-cli-source-pack'
          New-Item -ItemType Directory -Force -Path $packDir | Out-Null
          pnpm --dir apps/cli pack --pack-destination $packDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archives = @(Get-ChildItem -LiteralPath $packDir -Filter '*.tgz')
          if ($archives.Count -ne 1) { throw 'CLI source pack did not produce exactly one archive' }
          $members = @(tar -tf $archives[0].FullName)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($member in @('package/lib/bin.js', 'package/lib/profile-boot.js',
            'package/lib/types/profile-boot.d.ts', 'package/package.json')) {
            if ($members -notcontains $member) { throw "CLI source package lacks $member" }
          }
          $hostPackDir = Join-Path $env:RUNNER_TEMP 'alpha2-host-source-pack'
          New-Item -ItemType Directory -Force -Path $hostPackDir | Out-Null
          pnpm --dir apps/desktop-host pack --pack-destination $hostPackDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hostArchives = @(Get-ChildItem -LiteralPath $hostPackDir -Filter '*.tgz')
          if ($hostArchives.Count -ne 1) { throw 'Host source pack did not produce exactly one archive' }
          $hostMembers = @(tar -tf $hostArchives[0].FullName)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($member in @('package/lib/index.js', 'package/lib/alpha2-entry.js',
            'package/config/desktop.cordis.patch.yml', 'package/config/alpha2-desktop.cordis.patch.yml',
            'package/register-module-resolution-policy.mjs', 'package/package.json')) {
            if ($hostMembers -notcontains $member) { throw "Host source package lacks $member" }
          }
          $changed = @(git diff --name-only)
          $untracked = @(git ls-files --others --exclude-standard)
          if ($untracked.Count -ne 0 -or $changed.Count -gt 1 -or ($changed.Count -eq 1 -and $changed[0] -cne 'THIRD_PARTY_NOTICES.md')) {
            throw 'Source packs modified the checkout outside the owned notices artifact'
          }
          $expectedHash = (Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'alpha2-office-notices.sha256') -Raw).Trim()
          if ((Get-FileHash THIRD_PARTY_NOTICES.md -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expectedHash) {
            throw 'Source packs modified the frozen Office notices artifact'
          }

      - name: Test only the reviewed source contracts, never package or publish
        run: |
          pnpm exec vitest run `
            packages/boot/app-boot/tests/profile-pending-package.spec.ts `
            packages/boot/app-boot/tests/profile-package-lease.spec.ts `
            packages/boot/app-boot/tests/package-types.spec.ts `
            packages/boot/app-boot/tests/profile-plugins.spec.ts `
            packages/boot/app-boot/tests/profile-sanitize.spec.ts `
            packages/boot/app-boot/tests/profile-context.spec.ts `
            packages/boot/app-boot/tests/profile-root.spec.ts `
            packages/boot/app-boot/tests/profile.spec.ts `
            packages/boot/app-boot/tests/user-patches.spec.ts `
            packages/boot/app-boot/tests/watch-config.spec.ts `
            packages/boot/hmr/tests/coordination.spec.ts `
            packages/boot/hmr/tests/error.spec.ts `
            packages/boot/hmr/tests/modules.spec.ts `
            packages/boot/hmr/tests/profile.spec.ts `
            packages/boot/hmr/tests/reconciliation.spec.ts `
            packages/boot/hmr/tests/watch-config.spec.ts `
            packages/boot/plugin-manager/tests/build-approval.spec.ts `
            packages/boot/plugin-manager/tests/install-spec.spec.ts `
            packages/boot/plugin-manager/tests/operations.spec.ts `
            packages/boot/plugin-manager/tests/patch.spec.ts `
            packages/boot/plugin-manager/tests/tools.spec.ts `
            packages/host/plugin-inventory/tests/inventory.spec.ts `
            packages/skill/skill-office/tests/skill-office.spec.ts `
            packages/util/lazy-require/tests/index.spec.ts `
            packages/bundle/web-app/tests/web-app.spec.ts `
            packages/bundle/web-app/tests/official-browser-roster.spec.ts `
            packages/bundle/web-app/tests/official-office-roster.spec.ts `
            packages/document/office-to-pdf/tests/output.spec.ts `
            packages/document/office-to-pdf/tests/provider.spec.ts `
            packages/document/office-to-pdf/tests/queue.spec.ts `
            packages/document/office-to-pdf/tests/remote.spec.ts `
            apps/desktop-host/tests/package-transactions.spec.ts `
            apps/desktop-host/tests/alpha2-admission.spec.ts `
            apps/desktop-host/tests/alpha2-parent-stop.spec.ts `
            apps/desktop-host/tests/alpha2-profile-ownership.spec.ts `
            apps/desktop-host/tests/alpha2-injections.spec.ts `
            apps/desktop-host/tests/alpha2-owner-patch.spec.ts `
            apps/desktop-host/tests/alpha2-entry.spec.ts `
            apps/desktop-host/tests/alpha2-packaging.spec.ts `
            apps/desktop-host/tests/package-health.spec.ts `
            apps/desktop-host/tests/desktop-plugin-command-ipc.spec.ts `
            apps/desktop-host/tests/desktop-plugin-command-runtime.spec.ts `
            apps/desktop-host/tests/update-impact.spec.ts `
            apps/desktop-host/tests/update-task-control.spec.ts `
            apps/cli/tests/resolved-profile-boot.spec.ts `
            apps/cli/tests/resolved-profile-disposal.spec.ts `
            apps/cli/tests/profile-ownership.spec.ts `
            apps/cli/tests/profile-hmr.spec.ts `
            apps/desktop/tests/fork-release.spec.ts `
            apps/desktop/tests/web-document.spec.ts `
            apps/desktop/tests/runtime-file-policy.spec.ts `
            apps/desktop/tests/alpha2-profile-root.spec.ts `
            apps/desktop/tests/profile-package-snapshot.spec.ts `
            apps/desktop/tests/package-transaction-ipc.spec.ts `
            apps/web/tests/desktop-boot.spec.ts `
            apps/web/tests/injection-order.spec.ts `
            scripts/build-exe-for-python-sdk.spec.ts `
            scripts/libreoffice-engine.spec.ts `
            scripts/official-office-kit-lock.spec.ts `
            scripts/gen-third-party-notices.spec.ts `
            scripts/project-reference-faces.spec.ts `
            packages/api/gateway/tests/gateway.client.spec.ts `
            packages/api/remotes/tests/remote-events.host.spec.ts `
            packages/client/connection/tests/node-half.host.spec.ts `
            packages/client/modules/tests/node-half.client.spec.ts `
            --maxWorkers=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Run the protected native owner before the separate Recorder integration worker:
      # both remain required, but unrelated Windows Git fixture timing cannot mask this suite.
      - name: Test the same maintained Desktop project-manager suite in its own bounded worker
        run: |
          pnpm exec vitest run apps/desktop/tests/project-manager.spec.ts --maxWorkers=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Client face with official Browser, Manager and lazy Office Preview exports
        run: |
          pnpm run build:lib:client
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path packages/client/ui-sidebar-browser/lib/client.js)) {
            throw 'Official Sidebar Browser client export missing from source build'
          }
          if (!(Test-Path packages/client/ui-plugin-manager/lib/client.js)) {
            throw 'Official Manager UI client export missing from source build'
          }
          $preview = 'packages/client/ui-sidebar-documentpreview/lib'
          if (!(Test-Path (Join-Path $preview 'client.js')) -or !(Test-Path (Join-Path $preview 'client.pdf.js'))) {
            throw 'Official Office Preview client entry or licensed PDF.js chunk is missing'
          }

      - name: Test official Browser, Manager UI, Office Preview and terminal components without Desktop startup
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DSH_PINNED_PNPM_ENTRY) -or !(Test-Path -LiteralPath $env:DSH_PINNED_PNPM_ENTRY)) {
            throw 'Approved pinned pnpm entry is unavailable to package-license tests'
          }
          $env:npm_execpath = $env:DSH_PINNED_PNPM_ENTRY
          pnpm exec vitest run `
            packages/client/modules/tests/entries.client.spec.ts `
            packages/client/modules/tests/loader.client.spec.ts `
            packages/client/web/tests/boot-client.client.spec.ts `
            packages/client/hmr/tests/events.client.spec.ts `
            packages/client/hmr/tests/node-half.client.spec.ts `
            packages/client/ui-sidebar-browser/tests/apply.client.spec.ts `
            packages/client/ui-sidebar-browser/tests/browser-body.client.spec.tsx `
            packages/client/ui-sidebar-browser/tests/browser-controller.client.spec.ts `
            packages/client/ui-sidebar-browser/tests/browser-frame.client.spec.ts `
            packages/client/ui-sidebar-browser/tests/browser-navigation.client.spec.ts `
            packages/client/ui-sidebar-browser/tests/browser-title.client.spec.tsx `
            packages/client/ui-sidebar-browser/tests/store.client.spec.ts `
            packages/client/ui-sidebar-browser/tests/url.client.spec.ts `
            packages/client/ui-plugin-manager/tests/browser-plugin.client.spec.tsx `
            packages/client/ui-plugin-manager/tests/components.client.spec.tsx `
            packages/client/ui-plugin-manager/tests/config-ledger.client.spec.ts `
            packages/client/ui-plugin-manager/tests/manager-store.client.spec.ts `
            packages/client/ui-sidebar-documentpreview/tests/office-cache.client.spec.ts `
            packages/client/ui-sidebar-documentpreview/tests/office-registration.client.spec.ts `
            packages/client/ui-sidebar-documentpreview/tests/office-font-notice.client.spec.tsx `
            packages/client/ui-sidebar-documentpreview/tests/renderer-loading.client.spec.tsx `
            packages/client/ui-sidebar-documentpreview/tests/document-toolbar.client.spec.tsx `
            packages/client/ui-sidebar-documentpreview/tests/pdf-body.client.spec.tsx `
            packages/client/ui-sidebar-documentpreview/tests/pdf-document.client.spec.ts `
            packages/client/ui-sidebar-documentpreview/tests/pdf-license-bundle.client.spec.ts `
            packages/client/ui-primitives/tests/ansi.client.spec.ts `
            packages/client/ui-primitives/tests/terminal-block.client.spec.tsx `
            packages/client/ui-tool/tests/terminal-card.client.spec.tsx `
            --maxWorkers=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test all official named-profile Manager cases and staged no-write refusal
        run: |
          pnpm exec vitest run packages/boot/plugin-manager/tests/manager.spec.ts --maxWorkers=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Convert a real Office fixture with the declared Windows kit, no runtime download
        run: |
          $env:DSH_E2E_MAX_WORKERS = '1'
          pnpm exec vitest run packages/bundle/web-app/tests/document-conversion.e2e.ts `
            --config vitest.e2e.config.ts --retry 0 --maxWorkers=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test official workspace recorder contracts in a separate Windows worker
        run: |
          pnpm exec vitest run `
            packages/deliverables/workspace-changes/tests/capture.spec.ts `
            packages/deliverables/workspace-changes/tests/compare.spec.ts `
            packages/deliverables/workspace-changes/tests/git.spec.ts `
            packages/deliverables/workspace-changes/tests/git-truncation.spec.ts `
            packages/deliverables/workspace-changes/tests/loader-composition.spec.ts `
            packages/deliverables/workspace-changes/tests/numstat.spec.ts `
            packages/deliverables/workspace-changes/tests/paths.spec.ts `
            --maxWorkers=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test all official workspace recorder integration cases in one fresh worker
        run: |
          pnpm exec vitest run packages/deliverables/workspace-changes/tests/plugin.spec.ts --maxWorkers=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

name: Alpha2 compact snapshot refresh (temporary, nonpublishing)

# Remove after independent byte review/import; final tooling-free source still needs full CI.
# Narrow Linux producer exception: match PR92's approved Web producer and the existing
# Linux consumer lane. This Bash-context fixture has no Web platform override; do not
# generate Windows-specific shared pins or change the maintained normalizers.
on:
  push:
    branches: [cloga-official-first-016a2]

permissions:
  contents: read

concurrency:
  group: alpha2-compact-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'cloga/deepseek-harness' && github.ref == 'refs/heads/cloga-official-first-016a2'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      DSH_TELEMETRY_DISABLED: '1'
      DSH_BUILD_CLIENT_PROFILE: official
      DSH_EXAMPLE_MODE: lib
      DSH_SNAPSHOT_MAX_CONCURRENCY: '1'
      DSH_WEB_SNAPSHOT_WORKERS: '1'
      DSH_OXLINT_THREADS: '2'
      BOUND_WORKFLOW_SHA: ${{ github.workflow_sha }}
      BOUND_WORKFLOW_REF: ${{ github.workflow_ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
          run_install: false
          dest: ${{ runner.temp }}/alpha2-compact-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Bind source and allocate private audit state
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Linux') { throw 'Expected isolated hosted Linux Web producer' }
          $evidence = Join-Path $env:RUNNER_TEMP "alpha2-compact-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $evidence) { throw 'Evidence directory must be new' }
          New-Item -ItemType Directory -Path $evidence | Out-Null
          $env:COMPACT_EVIDENCE = $evidence
          "COMPACT_EVIDENCE=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PLAYWRIGHT_BROWSERS_PATH=$(Join-Path $evidence 'browsers')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NODE_COMPILE_CACHE=$(Join-Path $evidence 'node-cache')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMPDIR=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          @'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { copyFileSync, existsSync, lstatSync, mkdirSync, readFileSync, readlinkSync, realpathSync, writeFileSync } from 'node:fs';
          import { dirname, isAbsolute, join, relative, resolve } from 'node:path';
          const root = realpathSync(process.env.GITHUB_WORKSPACE);
          const evidence = realpathSync(process.env.COMPACT_EVIDENCE);
          const scenario = 'snapshots/web/manual-compact-model-selection';
          const outputs = ['session.v3.jsonl', 'system-prompt.expected.md', 'tool-schemas.expected.json', 'checkpoint.expected.md'].map(name => `${scenario}/${name}`);
          const spec = 'apps/web/tests/manual-compact-model-selection.e2e.ts';
          const title = 'uses the selected model for manual compact without another conversation request';
          const workflow = '.github/workflows/alpha2-compact-snapshot.yml';
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          const encode = value => Buffer.from(JSON.stringify(value, null, 2) + '\n');
          const git = args => execFileSync('git', ['--no-optional-locks', '-c', 'core.quotePath=false', ...args], { cwd: root, maxBuffer: 64 * 1024 * 1024, env: { ...process.env, GIT_TERMINAL_PROMPT: '0' } });
          const text = args => git(args).toString('utf8').trim();
          const safePath = path => {
            assert(typeof path === 'string' && !isAbsolute(path) && !/[\\\0\r\n]/u.test(path));
            assert(path.split('/').every(part => part && part !== '.' && part !== '..'));
            const absolute = resolve(root, path);
            assert(!relative(root, absolute).startsWith('..'));
            for (let parent = dirname(absolute); parent !== root; parent = dirname(parent)) {
              assert(parent !== dirname(parent), 'Path escaped checkout');
              assert(!lstatSync(parent).isSymbolicLink(), 'Input parent is a link');
            }
            return absolute;
          };
          const metadata = path => {
            const absolute = safePath(path), stat = lstatSync(absolute);
            assert(stat.isFile() || stat.isSymbolicLink(), 'Tracked input is not a file/link');
            const bytes = stat.isSymbolicLink() ? Buffer.from(readlinkSync(absolute)) : readFileSync(absolute);
            return { path, kind: stat.isSymbolicLink() ? 'link' : 'file', mode: stat.mode & 0o777, bytes: bytes.length, sha256: hash(bytes) };
          };
          const output = path => {
            const absolute = safePath(path), stat = lstatSync(absolute);
            assert(stat.isFile() && !stat.isSymbolicLink() && stat.size > 0 && stat.size <= 16 * 1024 * 1024, 'Invalid output file');
            const bytes = readFileSync(absolute);
            assert(Buffer.from(bytes.toString('utf8')).equals(bytes) && !bytes.includes(0), 'Invalid output UTF-8');
            return bytes;
          };
          const tree = () => git(['ls-tree', '-r', '-z', 'HEAD']).toString('utf8').split('\0').filter(Boolean).map(line => {
            const match = /^(100644|100755|120000) blob ([a-f0-9]{40})\t(.+)$/u.exec(line);
            assert(match, 'Unsupported tracked tree entry');
            return { path: match[3], gitMode: match[1], gitBlob: match[2] };
          });
          const assertSource = () => {
            assert.match(process.env.GITHUB_SHA ?? '', /^[a-f0-9]{40}$/u);
            assert.equal(process.env.GITHUB_REPOSITORY, 'cloga/deepseek-harness');
            assert.equal(process.env.GITHUB_REF, 'refs/heads/cloga-official-first-016a2');
            assert.equal(process.env.BOUND_WORKFLOW_SHA, process.env.GITHUB_SHA);
            assert.equal(process.env.BOUND_WORKFLOW_REF, `cloga/deepseek-harness/${workflow}@refs/heads/cloga-official-first-016a2`);
            assert.equal(text(['rev-parse', 'HEAD']), process.env.GITHUB_SHA);
            assert.equal(text(['diff', '--cached', '--name-only', 'HEAD']), '', 'Index changed');
            assert.equal(text(['ls-files', '--others', '--exclude-standard']), '', 'Unexpected nonignored untracked file');
            for (const name of ['DEEPSEEK_API_KEY', 'OPENAI_API_KEY', 'ANTHROPIC_API_KEY', 'GH_TOKEN', 'GITHUB_TOKEN']) assert(!process.env[name], 'No provider/publication credential may reach the fixture');
          };
          const readState = () => {
            const bytes = readFileSync(join(evidence, 'state.json'));
            assert.equal(hash(bytes), process.env.COMPACT_STATE_SHA256, 'Audit baseline changed');
            return JSON.parse(bytes);
          };
          const verifyInputs = state => {
            assertSource();
            assert.equal(text(['rev-parse', 'HEAD^{tree}']), state.sourceTree);
            assert.deepEqual(tree(), state.entries);
            for (const before of state.inputs) {
              const after = metadata(before.path);
              if (!outputs.includes(before.path)) assert.deepEqual(after, before, `Non-output input changed: ${before.path}`);
              else assert.equal(after.kind, 'file');
            }
            for (const path of git(['diff', '--no-ext-diff', '--no-textconv', '--name-only', '-z', 'HEAD']).toString('utf8').split('\0').filter(Boolean)) assert(outputs.includes(path), 'Changed path outside exact snapshot output set');
          };
          const report = phase => {
            const value = JSON.parse(readFileSync(join(evidence, `${phase}.json`), 'utf8'));
            assert.equal(value.success, true, `${phase}: test process failed`);
            assert.equal(value.numFailedTests, 0);
            assert.equal(value.numFailedTestSuites, 0, `${phase}: teardown failed`);
            assert.equal(value.numPassedTests, 1);
            assert.equal(value.numTotalTests, 1);
            assert.equal(value.numPendingTests, 0);
            assert.equal(value.testResults.length, 1);
            const suite = value.testResults[0];
            assert.equal(suite.status, 'passed');
            assert.equal(resolve(suite.name), resolve(root, spec));
            assert.equal(suite.assertionResults.length, 1);
            const test = suite.assertionResults[0];
            assert.equal(test.status, 'passed');
            assert.equal(test.title, title);
            assert.deepEqual(test.ancestorTitles, ['web e2e: manual compact model selection']);
            assert.deepEqual(test.failureMessages, []);
            return { passed: 1, skipped: 0, failed: 0, failedSuites: 0, reportSha256: hash(readFileSync(join(evidence, `${phase}.json`))) };
          };
          // Additional byte-derived checks preserve authored responses; the unchanged Web test/scaffold
          // owns Session decoding, lifecycle assertions, replay and maintained normalization.
          const authored = bytes => {
            const records = bytes.toString('utf8').trim().split('\n').map(line => JSON.parse(line));
            return records.flatMap(event => {
              if (event.type === 'assistant/message') return [{ type: event.type, content: event.data.message.content, source: event.data.message.source, stream: event.data.stream.map(item => ({ type: item.type, chunk: item.chunk })) }];
              if (event.type === 'compaction/summary') return [{ type: event.type, summary: event.data.summary, rawOutput: event.data.rawOutput, provider: event.data.provider, model: event.data.model, maxTokens: event.data.maxTokens }];
              if (event.type === 'user/message' && event.data.source.kind === 'user') return [{ type: event.type, content: event.data.content }];
              if (['permission/preset', 'sandbox/mode', 'approval/policy'].includes(event.type)) return [{ type: event.type, data: event.data }];
              return [];
            });
          };
          const mode = process.argv[2];
          assertSource();
          if (mode === 'before') {
            assert.equal(text(['status', '--porcelain']), '', 'Clean checkout required');
            const plan = JSON.parse(readFileSync(join(root, 'apps/desktop/release/cloga-windows-x64.json'), 'utf8'));
            assert.equal(plan.upstreamVersion, '0.1.6-alpha.2');
            assert.equal(plan.channel, 'cloga-windows-x64');
            const entries = tree(), paths = new Set(entries.map(row => row.path));
            for (const path of [workflow, spec, `${scenario}/snapshot.yml`, 'apps/web/tests/manual-compact-model-selection.overlay.yml', 'apps/web/tests/scaffold.ts', 'apps/web/tests/support.ts', 'vitest.web.config.ts', 'vitest.shared.ts', 'tsconfig.base.json', 'pnpm-lock.yaml', ...outputs]) assert(paths.has(path), 'Required tracked input missing');
            const state = { sourceCommit: process.env.GITHUB_SHA, sourceTree: text(['rev-parse', 'HEAD^{tree}']), node: process.version, entries, inputs: entries.map(row => metadata(row.path)), seedModelOutput: authored(output(outputs[0])) };
            const bytes = encode(state);
            writeFileSync(join(evidence, 'state.json'), bytes, { flag: 'wx' });
            console.log(`COMPACT_STATE_SHA256=${hash(bytes)}`);
          } else if (mode === 'inputs') {
            verifyInputs(readState());
          } else if (mode === 'refreshed') {
            const state = readState();
            verifyInputs(state);
            const checked = report('refresh');
            assert.deepEqual(authored(output(outputs[0])), state.seedModelOutput, 'Authored responses/prompts/permissions changed');
            const rows = outputs.map(path => ({ path, bytes: output(path).length, sha256: hash(output(path)) }));
            const bytes = encode({ checked, rows });
            writeFileSync(join(evidence, 'refreshed.json'), bytes, { flag: 'wx' });
            console.log(`COMPACT_REFRESH_SHA256=${hash(bytes)}`);
          } else if (mode === 'after') {
            const state = readState();
            verifyInputs(state);
            const refreshBytes = readFileSync(join(evidence, 'refreshed.json'));
            assert.equal(hash(refreshBytes), process.env.COMPACT_REFRESH_SHA256, 'Refresh receipt changed');
            const refresh = JSON.parse(refreshBytes);
            const replay = report('replay');
            assert.deepEqual(report('refresh'), refresh.checked);
            const rows = outputs.map(path => ({ path, bytes: output(path).length, sha256: hash(output(path)) }));
            assert.deepEqual(rows, refresh.rows, 'Replay rewrote snapshot outputs');
            assert.deepEqual(authored(output(outputs[0])), state.seedModelOutput, 'Authored fixture changed');
            const upload = join(evidence, 'upload');
            assert(!existsSync(upload), 'Upload directory must be new');
            mkdirSync(upload);
            for (const row of rows) {
              const target = join(upload, 'files', row.path);
              mkdirSync(dirname(target), { recursive: true });
              copyFileSync(safePath(row.path), target);
              assert.equal(hash(readFileSync(target)), row.sha256, 'Raw copied bytes differ');
            }
            writeFileSync(join(upload, 'inputs.json'), encode({ sourceCommit: state.sourceCommit, sourceTree: state.sourceTree, entries: state.entries, inputs: state.inputs }));
            const manifest = { schemaVersion: 1, scope: 'keyless-refresh-and-replay-only', sourceCommit: state.sourceCommit, sourceTree: state.sourceTree, workflow: process.env.BOUND_WORKFLOW_REF, workflowSha: process.env.BOUND_WORKFLOW_SHA, runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT, node: process.version, platform: process.platform, lockfileSha256: state.inputs.find(row => row.path === 'pnpm-lock.yaml').sha256, inputsSha256: hash(readFileSync(join(upload, 'inputs.json'))), refresh: refresh.checked, replay, outputs: rows, releaseQualified: false, installerExecuted: false, liveProviderCalled: false, acceptance: 'Review original bytes against this source; remove workflow and qualify the final exact source separately.' };
            writeFileSync(join(upload, 'generation.json'), encode(manifest));
            console.log('Exact manual compact snapshot refresh/replay audited; not release qualification.');
          } else { throw new Error('Unknown audit mode'); }
          '@ | Set-Content -LiteralPath (Join-Path $evidence 'audit.mjs') -Encoding utf8NoBOM
          node --check (Join-Path $evidence 'audit.mjs')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node (Join-Path $evidence 'audit.mjs') before | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "COMPACT_AUDITOR_SHA256=$((Get-FileHash -LiteralPath (Join-Path $evidence 'audit.mjs') -Algorithm SHA256).Hash.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install frozen dependencies and ordinary browser prerequisites
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bash scripts/prepare-ci-bubblewrap.sh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build normal Host and Client artifacts
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $audit = Join-Path $env:COMPACT_EVIDENCE 'audit.mjs'
          if ((Get-FileHash -LiteralPath $audit -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:COMPACT_AUDITOR_SHA256) { throw 'Audit code changed' }
          node $audit inputs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Refresh only the authored manual compact Web scenario
        env:
          # record selects live-provider mode and this scenario skips it; refresh is the maintained keyless writer.
          DSH_SNAPSHOT: refresh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm exec vitest run --config vitest.web.config.ts apps/web/tests/manual-compact-model-selection.e2e.ts --reporter=json "--outputFile=$env:COMPACT_EVIDENCE/refresh.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $audit = Join-Path $env:COMPACT_EVIDENCE 'audit.mjs'
          if ((Get-FileHash -LiteralPath $audit -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:COMPACT_AUDITOR_SHA256) { throw 'Audit code changed' }
          node $audit refreshed | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Replay the same target and reject output or source drift
        env:
          DSH_SNAPSHOT: replay
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm exec vitest run --config vitest.web.config.ts apps/web/tests/manual-compact-model-selection.e2e.ts --reporter=json "--outputFile=$env:COMPACT_EVIDENCE/replay.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $audit = Join-Path $env:COMPACT_EVIDENCE 'audit.mjs'
          if ((Get-FileHash -LiteralPath $audit -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:COMPACT_AUDITOR_SHA256) { throw 'Audit code changed' }
          node $audit after
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: alpha2-compact-snapshot-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.COMPACT_EVIDENCE }}/upload/
          if-no-files-found: error
          retention-days: 7

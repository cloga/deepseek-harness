name: Source-bound direct-child staging observation

# Temporary diagnostic only: neither a release gate nor an EPERM cause/repair finding.
on:
  push:
    branches:
      - cloga-alpha2-staging-observation-hosted

permissions:
  contents: read

concurrency:
  group: direct-child-staging-observation-hosted-${{ github.repository }}
  cancel-in-progress: false

jobs:
  observe:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      NODE_VERSION: '24.13.0'
      PNPM_VERSION: '11.7.0'
      DSH_TELEMETRY_DISABLED: '1'
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      PUSH_AFTER: ${{ github.event.after }}
    steps:
      - name: Check out the exact workflow commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
          clean: true

      - name: Bind workflow, source and tested verifier before dependencies
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $base = 'e5b30494ee6f4ca7fc83a74ac36fc1e71be87a76'
          $source = '1f56895846c4b7883672840d5f1689cb40298d98'
          $sourceTree = '7a5b1d99d68234adceaf3a98270b0aebda5b8316'
          $workflowPath = '.github/workflows/direct-child-staging-observation.yml'
          $expectedWorkflowRef = 'cloga/deepseek-harness/.github/workflows/direct-child-staging-observation.yml@refs/heads/cloga-alpha2-staging-observation-hosted'
          if ($env:GITHUB_REPOSITORY -cne 'cloga/deepseek-harness' -or
              $env:GITHUB_EVENT_NAME -cne 'push' -or
              $env:GITHUB_REF -cne 'refs/heads/cloga-alpha2-staging-observation-hosted' -or
              $env:GITHUB_REF_TYPE -cne 'branch' -or $env:GITHUB_RUN_ATTEMPT -cne '1' -or
              $env:WORKFLOW_REF -cne $expectedWorkflowRef) { throw 'Unapproved diagnostic invocation' }
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ARCH -cne 'X64') { throw 'Unapproved runner platform' }
          if ($env:GITHUB_RUN_ID -cnotmatch '\A[0-9]{1,24}\z' -or
              $env:GITHUB_SHA -cnotmatch '\A[0-9a-f]{40}\z' -or
              $env:WORKFLOW_SHA -cne $env:GITHUB_SHA -or $env:PUSH_AFTER -cne $env:GITHUB_SHA) {
            throw 'Event and workflow commit identities disagree'
          }
          $head = git rev-parse HEAD
          if ($null -eq $LASTEXITCODE) { exit 1 }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($head -cne $env:GITHUB_SHA) { throw 'Checkout does not match the workflow event commit' }
          $workflowParents = git rev-list --parents -n 1 HEAD
          if ($null -eq $LASTEXITCODE) { exit 1 }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($workflowParents -cne "$head $source") { throw 'Workflow commit must have exactly the reviewed source parent' }
          $workflowChanges = @(git diff --name-status --no-renames $source $head)
          if ($null -eq $LASTEXITCODE) { exit 1 }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($workflowChanges.Count -ne 1 -or $workflowChanges[0] -cne "A`t$workflowPath") {
            throw 'Workflow commit must only add the diagnostic workflow'
          }
          $sourceParents = git rev-list --parents -n 1 $source
          if ($null -eq $LASTEXITCODE) { exit 1 }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($sourceParents -cne "$source $base") { throw 'Source parent does not match the reviewed base' }
          $actualTree = git rev-parse "$source`^{tree}"
          if ($null -eq $LASTEXITCODE) { exit 1 }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($actualTree -cne $sourceTree) { throw 'Source tree identity mismatch' }
          $sourceChanges = @(git diff --name-only --no-renames $base $source)
          if ($null -eq $LASTEXITCODE) { exit 1 }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $allowedSourceChanges = @(
            'apps/desktop/src/profile-package-pnpm.ts',
            'apps/desktop/tests/profile-package-pnpm-observation.spec.ts',
            'apps/desktop/tests/profile-package-staging.spec.ts'
          )
          if ($sourceChanges.Count -ne 3) { throw 'Unexpected instrumentation source scope' }
          foreach ($path in $sourceChanges) {
            if ($allowedSourceChanges -cnotcontains $path) { throw 'Unexpected instrumentation source path' }
          }
          $dirty = @(git --no-optional-locks status --porcelain --untracked-files=no)
          if ($null -eq $LASTEXITCODE) { exit 1 }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($dirty.Count -ne 0) { throw 'Workflow checkout has tracked changes' }
          git checkout --detach $source
          if ($null -eq $LASTEXITCODE) { exit 1 }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $detached = git rev-parse HEAD
          if ($null -eq $LASTEXITCODE) { exit 1 }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($detached -cne $source) { throw 'Source detach failed' }
          $dirty = @(git --no-optional-locks status --porcelain --untracked-files=no)
          if ($null -eq $LASTEXITCODE) { exit 1 }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($dirty.Count -ne 0) { throw 'Reviewed source is not clean' }
          $expectedHashes = [ordered]@{
            'pnpm-lock.yaml' = '1607E6898DEBD0861AF3D4352DDF597DC023F6D1E3313280210F61531A452A66'
            'package.json' = 'A9CC164C4D922D74571E09C04BE4E0F85A318685D410BB1C56072258A19A6F1D'
            'apps/desktop/package.json' = '43A4FE0B9931213F7797005A25043FC401DA404C4B86111A37F5A888A577658D'
            'vitest.config.ts' = '1DF014A5139645B1DC977FA5F78891E99E872FB42A63FDDB5AE6F5BC6107299D'
            'vitest.desktop-release.config.ts' = 'F7655A1140E38A834586ACC779AE0B746752C7DFFFFB601106FCEF58A513E56E'
            'vitest.shared.ts' = '3E8900B7471BFFAB582974B3A0A6413140D8143D41F62F19A348C41AD3A316A0'
            'tsconfig.host.json' = '3CB83B2131B5C4841FF07E312B2E1DDDD7F2F493F40AB94012240822140F25BD'
            'apps/desktop/src/profile-package-pnpm.ts' = '740AF261C606086EBDBCECC3B47339C2B05B914E841B81459FDDAF6FF345534A'
            'apps/desktop/tests/profile-package-pnpm-observation.spec.ts' = 'D9BC390762DFA26E07B2D4E8FB3C9B0CA4A92EC355BFF5657DC420A3729B057D'
            'apps/desktop/tests/profile-package-staging.spec.ts' = '00AC502B374BBAD05E8579718C6877640E6B80D14BEDE5095F7FF5BA20FD2CBD'
          }
          foreach ($entry in $expectedHashes.GetEnumerator()) {
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $entry.Key).Hash
            if ($actual -cne $entry.Value) { throw 'Reviewed source/configuration hash mismatch' }
            Write-Output ('sha256 {0} {1}' -f $entry.Key, $actual)
          }
          foreach ($value in @($env:ImageOS, $env:ImageVersion)) {
            if ($value -cnotmatch '\A[A-Za-z0-9._-]{1,64}\z') { throw 'Runner image identity unavailable' }
          }
          Write-Output ('binding base={0} source={1} workflow={2} run={3} attempt=1' -f $base, $source, $head, $env:GITHUB_RUN_ID)
          Write-Output ('workflow-ref={0}; image={1}/{2}; pwsh={3}' -f $env:WORKFLOW_REF, $env:ImageOS, $env:ImageVersion, $PSVersionTable.PSVersion)
          if (-not [string]::IsNullOrEmpty($env:DSH_TEST_DESKTOP_PNPM)) { throw 'External fixture pnpm override is forbidden' }

          # Exact tested LF definition. Only generated-shell CRLF is canonicalized; no other normalization.
          function Test-VitestSelection {
              [CmdletBinding()]
              param(
                  [Parameter(Mandatory)][string] $ReportPath,
                  [Parameter(Mandatory)][string] $ExpectedFile,
                  [Parameter(Mandatory)][AllowEmptyCollection()][AllowEmptyString()][string[]] $ExpectedFullNames,
                  [bool] $DedicatedUnfiltered = $false
              )

              # Every result has exactly these two fields. Never return exception text or report data.
              function Result([bool] $Passed, [string] $Reason) {
                  return [pscustomobject]@{ passed = $Passed; reason = $Reason }
              }
              function IsCounter($Value) {
                  return (($Value -is [int] -or $Value -is [long]) -and $Value -ge 0)
              }

              try {
                  if ($ExpectedFullNames.Count -eq 0 -or $ExpectedFullNames.Count -gt 1024) {
                      return Result $false 'invalid-expectations'
                  }
                  $expected = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
                  foreach ($name in $ExpectedFullNames) {
                      if ([string]::IsNullOrWhiteSpace($name) -or $name.Length -gt 2048 -or -not $expected.Add($name)) {
                          return Result $false 'invalid-expectations'
                      }
                  }
                  if (-not [IO.Path]::IsPathFullyQualified($ExpectedFile)) {
                      return Result $false 'invalid-expectations'
                  }
                  $expectedPath = [IO.Path]::GetFullPath($ExpectedFile)

                  # Read at most 8 MiB plus one sentinel byte from one handle. No stat/read race
                  # can make this read allocate or consume the rest of an oversized report.
                  # This is a byte bound, not an I/O deadline or a guarantee of atomic writer completion.
                  $limit = 8 * 1024 * 1024
                  $bytes = [byte[]]::new($limit + 1)
                  $length = 0
                  $stream = $null
                  try {
                      $stream = [IO.File]::Open($ReportPath, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::Read)
                      while ($length -lt $bytes.Length) {
                          $read = $stream.Read($bytes, $length, $bytes.Length - $length)
                          if ($read -eq 0) { break }
                          $length += $read
                      }
                  } catch {
                      return Result $false 'report-unreadable'
                  } finally {
                      if ($null -ne $stream) { $stream.Dispose() }
                  }
                  if ($length -gt $limit) { return Result $false 'report-too-large' }
                  if ($length -eq 0) { return Result $false 'empty-report' }
                  try {
                      $utf8 = [Text.UTF8Encoding]::new($false, $true)
                      $text = $utf8.GetString($bytes, 0, $length)
                      if ($text.Length -gt 0 -and $text[0] -eq [char]0xFEFF) { $text = $text.Substring(1) }
                      $report = ConvertFrom-Json -InputObject $text -AsHashtable -NoEnumerate -Depth 32 -ErrorAction Stop
                  } catch {
                      return Result $false 'invalid-json'
                  }
                  if ($report -isnot [Collections.IDictionary] -or $report.success -isnot [bool] -or
                      $report.testResults -isnot [array] -or $report.testResults.Count -ne 1) {
                      return Result $false 'invalid-report'
                  }
                  $suite = $report.testResults[0]
                  if ($suite -isnot [Collections.IDictionary] -or $suite.name -isnot [string] -or
                      -not [IO.Path]::IsPathFullyQualified($suite.name)) {
                      return Result $false 'invalid-report'
                  }
                  if (-not [string]::Equals([IO.Path]::GetFullPath($suite.name), $expectedPath, [StringComparison]::OrdinalIgnoreCase)) {
                      return Result $false 'wrong-file'
                  }
                  if ($suite.assertionResults -isnot [array]) { return Result $false 'invalid-report' }
                  $assertions = $suite.assertionResults
                  if ($assertions.Count -eq 0) { return Result $false 'empty-tests' }

                  $seen = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
                  $passed = 0
                  $failed = 0
                  $pending = 0
                  $todo = 0
                  foreach ($assertion in $assertions) {
                      if ($assertion -isnot [Collections.IDictionary] -or $assertion.fullName -isnot [string] -or
                          [string]::IsNullOrWhiteSpace($assertion.fullName) -or $assertion.status -isnot [string]) {
                          return Result $false 'invalid-report'
                      }
                      if (-not $seen.Add($assertion.fullName)) { return Result $false 'duplicate-case' }
                      switch -CaseSensitive ($assertion.status) {
                          'passed' { $passed++ }
                          'failed' { $failed++ }
                          'pending' { $pending++ }
                          'skipped' { $pending++ }
                          'todo' { $todo++ }
                          default { return Result $false 'unknown-status' }
                      }
                  }
                  foreach ($field in @('numPassedTests', 'numFailedTests', 'numPendingTests', 'numTodoTests', 'numTotalTests')) {
                      if (-not (IsCounter $report[$field])) { return Result $false 'invalid-counter' }
                  }
                  if ($report.numPassedTests -ne $passed -or $report.numFailedTests -ne $failed -or
                      $report.numPendingTests -ne $pending -or $report.numTodoTests -ne $todo -or
                      $report.numTotalTests -ne $assertions.Count) {
                      return Result $false 'counter-mismatch'
                  }
                  if ($DedicatedUnfiltered -and ($assertions.Count -ne $expected.Count -or $pending -ne 0 -or $todo -ne 0)) {
                      return Result $false 'dedicated-incomplete'
                  }
                  foreach ($name in $expected) {
                      if (-not $seen.Contains($name)) { return Result $false 'missing-case' }
                  }
                  foreach ($assertion in $assertions) {
                      $selected = $expected.Contains($assertion.fullName)
                      if ($selected -and $assertion.status -cne 'passed') { return Result $false 'selected-not-passed' }
                      if (-not $selected -and $assertion.status -cin @('passed', 'failed')) {
                          return Result $false 'unexpected-executed'
                      }
                  }
                  if ($passed -ne $expected.Count -or $failed -ne 0) { return Result $false 'counter-mismatch' }
                  if (-not $report.success -or $suite.status -cne 'passed') { return Result $false 'run-unsuccessful' }
                  return Result $true 'verified'
              } catch {
                  return Result $false 'invalid-report'
              }
          }

          $functionAst = (Get-Command Test-VitestSelection -CommandType Function).ScriptBlock.Ast
          if ($functionAst -isnot [Management.Automation.Language.FunctionDefinitionAst]) { throw 'Loaded verifier function unavailable' }
          $utf8 = [Text.UTF8Encoding]::new($false, $true)
          $definition = $functionAst.Extent.Text.Replace("`r`n", "`n")
          $functionHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($utf8.GetBytes($definition))).ToLowerInvariant()
          if ($functionHash -cne '38ddb2bc8e817bccdfd91d576e186c6689d694593917b1240e941514140dade3') {
            throw 'Embedded verifier differs from the tested function'
          }
          if (-not [IO.Path]::IsPathFullyQualified($env:RUNNER_TEMP)) { throw 'Runner temp is unavailable' }
          $root = Join-Path $env:RUNNER_TEMP ('direct-child-observation-' + $env:GITHUB_RUN_ID + '-1')
          if (Test-Path -LiteralPath $root) { throw 'Diagnostic temp directory already exists' }
          [void][IO.Directory]::CreateDirectory($root)
          $checker = Join-Path $root 'Assert-VitestSelection.ps1'
          $stream = [IO.File]::Open($checker, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::None)
          try {
            $bytes = $utf8.GetBytes($definition)
            $stream.Write($bytes, 0, $bytes.Length)
          } finally { $stream.Dispose() }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "DIRECT_CHILD_ROOT=$root`nDIRECT_CHILD_CHECKER=$checker`n", $utf8)
          Write-Output ('verified-checker-sha256=' + $functionHash)

      - name: Set up the original builder Node version
        uses: actions/setup-node@v6
        with:
          node-version: '24.13.0'
          package-manager-cache: false

      - name: Set up pinned pnpm outside the checkout
        uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
          dest: ${{ runner.temp }}/direct-child-pnpm-${{ github.run_id }}
          run_install: false

      - name: Assert actual tool versions
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $nodeVersion = node --version
          $nodeExit = $LASTEXITCODE
          if ($null -eq $nodeExit) { exit 1 }
          if ($nodeExit -ne 0) { exit $nodeExit }
          if ($nodeVersion -cne 'v24.13.0') { throw 'Unexpected Node version' }
          $pnpmVersion = pnpm --version
          $pnpmExit = $LASTEXITCODE
          if ($null -eq $pnpmExit) { exit 1 }
          if ($pnpmExit -ne 0) { exit $pnpmExit }
          if ($pnpmVersion -cne '11.7.0') { throw 'Unexpected pnpm version' }
          Write-Output ('tools node={0}; pnpm={1}' -f $nodeVersion, $pnpmVersion)

      - name: Install the frozen workspace normally
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          pnpm install --frozen-lockfile
          $installExit = $LASTEXITCODE
          if ($null -eq $installExit) { exit 1 }
          if ($installExit -ne 0) { exit $installExit }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath pnpm-lock.yaml).Hash -cne '1607E6898DEBD0861AF3D4352DDF597DC023F6D1E3313280210F61531A452A66') {
            throw 'Frozen lockfile changed'
          }
          $vitestVersion = node -p "require('./node_modules/vitest/package.json').version"
          $versionExit = $LASTEXITCODE
          if ($null -eq $versionExit) { exit 1 }
          if ($versionExit -ne 0) { exit $versionExit }
          if ($vitestVersion -cne '4.1.8') { throw 'Unexpected Vitest reporter version' }
          $fixturePnpmVersion = node -p "require('./apps/desktop/node_modules/pnpm/package.json').version"
          $fixtureVersionExit = $LASTEXITCODE
          if ($null -eq $fixtureVersionExit) { exit 1 }
          if ($fixtureVersionExit -ne 0) { exit $fixtureVersionExit }
          if ($fixturePnpmVersion -cne '11.7.0') { throw 'Unexpected fixture pnpm version' }
          Write-Output ('reporter vitest={0}; fixture-pnpm={1}' -f $vitestVersion, $fixturePnpmVersion)

      - name: Build ordinary Host contracts
        timeout-minutes: 20
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          pnpm run build:lib:host
          $buildExit = $LASTEXITCODE
          if ($null -eq $buildExit) { exit 1 }
          if ($buildExit -ne 0) { exit $buildExit }

      - name: Run ordinary focused typed lint
        timeout-minutes: 10
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          pnpm exec tsx scripts/run-oxlint.ts apps/desktop/src/profile-package-pnpm.ts apps/desktop/tests/profile-package-pnpm-observation.spec.ts apps/desktop/tests/profile-package-staging.spec.ts
          $lintExit = $LASTEXITCODE
          if ($null -eq $lintExit) { exit 1 }
          if ($lintExit -ne 0) { exit $lintExit }

      - name: Execute and verify all 21 direct-child controls
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $root = Join-Path $env:RUNNER_TEMP ('direct-child-observation-' + $env:GITHUB_RUN_ID + '-1')
          $checker = Join-Path $root 'Assert-VitestSelection.ps1'
          if ($env:DIRECT_CHILD_ROOT -cne $root -or $env:DIRECT_CHILD_CHECKER -cne $checker) { throw 'Diagnostic path binding changed' }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $checker).Hash.ToLowerInvariant() -cne '38ddb2bc8e817bccdfd91d576e186c6689d694593917b1240e941514140dade3') { throw 'Verifier file hash mismatch' }
          . $checker
          $ast = (Get-Command Test-VitestSelection -CommandType Function).ScriptBlock.Ast
          if ($ast -isnot [Management.Automation.Language.FunctionDefinitionAst]) { throw 'Verifier function unavailable' }
          $utf8 = [Text.UTF8Encoding]::new($false, $true)
          $definition = $ast.Extent.Text.Replace("`r`n", "`n")
          $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($utf8.GetBytes($definition))).ToLowerInvariant()
          if ($hash -cne '38ddb2bc8e817bccdfd91d576e186c6689d694593917b1240e941514140dade3') { throw 'Loaded verifier hash mismatch' }
          if (-not [string]::IsNullOrEmpty($env:DSH_TEST_DESKTOP_PNPM)) { throw 'External fixture pnpm override is forbidden' }
          $report = Join-Path $root 'observation-controls.json'
          if (Test-Path -LiteralPath $report) { throw 'Report path is not fresh' }
          $expected = @(
            'optional pnpm direct-child observations settles only at close with exit-first observations',
            'optional pnpm direct-child observations settles only at close with stdio-first observations',
            'optional pnpm direct-child observations does not register optional listeners or project unknown error fields without an observer',
            'optional pnpm direct-child observations reads an emitted error code once and preserves identity: known',
            'optional pnpm direct-child observations reads an emitted error code once and preserves identity: unknown',
            'optional pnpm direct-child observations reads an emitted error code once and preserves identity: throws',
            'optional pnpm direct-child observations uses event signal values, not another child signalCode read, and closes observation ownership',
            'optional pnpm direct-child observations contains a synchronous observer fault without replacing the result: Error',
            'optional pnpm direct-child observations contains a synchronous observer fault without replacing the result: string',
            'optional pnpm direct-child observations contains a synchronous observer fault without replacing the result: undefined',
            'optional pnpm direct-child observations retains a synchronous spawn rejection with no invented child observations: Error',
            'optional pnpm direct-child observations retains a synchronous spawn rejection with no invented child observations: string',
            'optional pnpm direct-child observations retains a synchronous spawn rejection with no invented child observations: undefined',
            'optional pnpm direct-child observations rejects an already-aborted request before observing or spawning: user-error',
            'optional pnpm direct-child observations rejects an already-aborted request before observing or spawning: native-timeout',
            'optional pnpm direct-child observations rejects an already-aborted request before observing or spawning: string',
            'optional pnpm direct-child observations keeps user cancellation priority through direct-child close',
            'optional pnpm direct-child observations keeps deadline cancellation priority through direct-child close',
            'optional pnpm direct-child observations keeps user-named-timeout cancellation priority through direct-child close',
            'optional pnpm direct-child observations keeps the native deadline reason as the close-time wrapper cause without an observer timer',
            'optional pnpm direct-child observations leaves existing combined stdout/stderr failure bounds and redaction unchanged'
          )
          pnpm exec vitest run apps/desktop/tests/profile-package-pnpm-observation.spec.ts --config=vitest.desktop-release.config.ts --maxWorkers=1 --reporter=verbose --reporter=json "--outputFile.json=$report"
          $testExit = $LASTEXITCODE
          if ($null -eq $testExit) { exit 1 }
          if ($testExit -ne 0) { exit $testExit }
          $verified = $false
          try {
            $decision = Test-VitestSelection -ReportPath $report -ExpectedFile (Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/tests/profile-package-pnpm-observation.spec.ts') -ExpectedFullNames $expected -DedicatedUnfiltered $true
            $verified = $decision.passed
            Write-Output ('Selection verification: {0}; expected=21' -f $decision.reason)
          } catch {
            # Verifier/output failure can only reject an otherwise successful native invocation.
            $verified = $false
          }
          # Vitest 4.1.8 JSON success omits global unhandled errors; nonzero native exits returned above.
          if (-not $verified) { exit 1 }

      - name: Execute and verify all 14 staging identity and sink controls
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $root = Join-Path $env:RUNNER_TEMP ('direct-child-observation-' + $env:GITHUB_RUN_ID + '-1')
          $checker = Join-Path $root 'Assert-VitestSelection.ps1'
          if ($env:DIRECT_CHILD_ROOT -cne $root -or $env:DIRECT_CHILD_CHECKER -cne $checker) { throw 'Diagnostic path binding changed' }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $checker).Hash.ToLowerInvariant() -cne '38ddb2bc8e817bccdfd91d576e186c6689d694593917b1240e941514140dade3') { throw 'Verifier file hash mismatch' }
          . $checker
          $ast = (Get-Command Test-VitestSelection -CommandType Function).ScriptBlock.Ast
          if ($ast -isnot [Management.Automation.Language.FunctionDefinitionAst]) { throw 'Verifier function unavailable' }
          $utf8 = [Text.UTF8Encoding]::new($false, $true)
          $definition = $ast.Extent.Text.Replace("`r`n", "`n")
          $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($utf8.GetBytes($definition))).ToLowerInvariant()
          if ($hash -cne '38ddb2bc8e817bccdfd91d576e186c6689d694593917b1240e941514140dade3') { throw 'Loaded verifier hash mismatch' }
          if (-not [string]::IsNullOrEmpty($env:DSH_TEST_DESKTOP_PNPM)) { throw 'External fixture pnpm override is forbidden' }
          $report = Join-Path $root 'staging-controls.json'
          if (Test-Path -LiteralPath $report) { throw 'Report path is not fresh' }
          $expected = @(
            'staged-frozen direct-child observation reporting caps request-local events and encoded bytes without changing the captured facts',
            'staged-frozen direct-child observation reporting collects in memory and performs one explicit failure-only write without attaching the failure',
            'staged-frozen direct-child observation reporting does not replace primary or cleanup identities after sink failure',
            'staged-frozen direct-child observation reporting does not replace primary or cleanup identities after sink short-write',
            'Desktop stage-only package transactions retains both failures and reports incomplete cleanup: Error identities',
            'Desktop stage-only package transactions retains both failures and reports incomplete cleanup: undefined primary',
            'Desktop stage-only package transactions retains both failures and reports incomplete cleanup: undefined cleanup',
            'Desktop stage-only package transactions rejects cancellation with both original failures when aborted preparation cleanup cannot finish',
            'Desktop stage-only package transactions preserves the original Error rejection when failed preparation cleanup completes',
            'Desktop stage-only package transactions preserves the original string rejection when failed preparation cleanup completes',
            'Desktop stage-only package transactions preserves the original undefined rejection when failed preparation cleanup completes',
            'Desktop stage-only package transactions does not hide runner failure behind a cancellation acknowledgement',
            'Desktop stage-only package transactions does not acknowledge cancellation until the injected pnpm runner has quiesced',
            'Desktop stage-only package transactions keeps active metadata when pnpm fails or times out with exit zero'
          )
          $filter = '^(?:' + (($expected | ForEach-Object { [regex]::Escape($_) }) -join '|') + ')$'
          pnpm exec vitest run apps/desktop/tests/profile-package-staging.spec.ts --config=vitest.desktop-release.config.ts --maxWorkers=1 --reporter=verbose --reporter=json "--outputFile.json=$report" -t $filter
          $testExit = $LASTEXITCODE
          if ($null -eq $testExit) { exit 1 }
          if ($testExit -ne 0) { exit $testExit }
          $verified = $false
          try {
            $decision = Test-VitestSelection -ReportPath $report -ExpectedFile (Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/tests/profile-package-staging.spec.ts') -ExpectedFullNames $expected -DedicatedUnfiltered $false
            $verified = $decision.passed
            Write-Output ('Selection verification: {0}; expected=14' -f $decision.reason)
          } catch {
            $verified = $false
          }
          if (-not $verified) { exit 1 }

      - name: Execute the three offline cases once after all controls pass
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $root = Join-Path $env:RUNNER_TEMP ('direct-child-observation-' + $env:GITHUB_RUN_ID + '-1')
          $checker = Join-Path $root 'Assert-VitestSelection.ps1'
          if ($env:DIRECT_CHILD_ROOT -cne $root -or $env:DIRECT_CHILD_CHECKER -cne $checker) { throw 'Diagnostic path binding changed' }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $checker).Hash.ToLowerInvariant() -cne '38ddb2bc8e817bccdfd91d576e186c6689d694593917b1240e941514140dade3') { throw 'Verifier file hash mismatch' }
          . $checker
          $ast = (Get-Command Test-VitestSelection -CommandType Function).ScriptBlock.Ast
          if ($ast -isnot [Management.Automation.Language.FunctionDefinitionAst]) { throw 'Verifier function unavailable' }
          $utf8 = [Text.UTF8Encoding]::new($false, $true)
          $definition = $ast.Extent.Text.Replace("`r`n", "`n")
          $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($utf8.GetBytes($definition))).ToLowerInvariant()
          if ($hash -cne '38ddb2bc8e817bccdfd91d576e186c6689d694593917b1240e941514140dade3') { throw 'Loaded verifier hash mismatch' }
          if (-not [string]::IsNullOrEmpty($env:DSH_TEST_DESKTOP_PNPM)) { throw 'External fixture pnpm override is forbidden' }
          $report = Join-Path $root 'offline-fixture.json'
          if (Test-Path -LiteralPath $report) { throw 'Report path is not fresh' }
          $expected = @(
            'Desktop stage-only package transactions reconstructs a real offline transitive graph and checks relocation: ready',
            'Desktop stage-only package transactions reconstructs a real offline transitive graph and checks relocation: missing-cache',
            'Desktop stage-only package transactions reconstructs a real offline transitive graph and checks relocation: tampered-cache'
          )
          $filter = '^(?:' + (($expected | ForEach-Object { [regex]::Escape($_) }) -join '|') + ')$'
          pnpm exec vitest run apps/desktop/tests/profile-package-staging.spec.ts --config=vitest.desktop-release.config.ts --maxWorkers=1 --reporter=verbose --reporter=json "--outputFile.json=$report" -t $filter
          $testExit = $LASTEXITCODE
          if ($null -eq $testExit) { exit 1 }
          if ($testExit -ne 0) { exit $testExit }
          $verified = $false
          try {
            $decision = Test-VitestSelection -ReportPath $report -ExpectedFile (Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/tests/profile-package-staging.spec.ts') -ExpectedFullNames $expected -DedicatedUnfiltered $false
            $verified = $decision.passed
            Write-Output ('Selection verification: {0}; expected=3' -f $decision.reason)
          } catch {
            $verified = $false
          }
          if (-not $verified) { exit 1 }

      - name: Verify final source binding without exporting reports
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $head = git rev-parse HEAD
          if ($null -eq $LASTEXITCODE) { exit 1 }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($head -cne '1f56895846c4b7883672840d5f1689cb40298d98') { throw 'Source HEAD changed during the diagnostic' }
          $dirty = @(git --no-optional-locks status --porcelain --untracked-files=no)
          if ($null -eq $LASTEXITCODE) { exit 1 }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($dirty.Count -ne 0) { throw 'Tracked source changed during the diagnostic' }

name: Alpha2 source-bound generators (temporary, nonpublishing)

# Remove after importing and reviewing the generated originals. This is not release qualification.
on:
  push:
    branches: [cloga-official-first-016a2]

permissions:
  contents: read

concurrency:
  group: alpha2-source-generators-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'cloga/deepseek-harness' && github.ref == 'refs/heads/cloga-official-first-016a2'
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: '24.13.0'
          package-manager-cache: false
      - name: Require exact alpha2 source and clean checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_SHA -cnotmatch '\A[0-9a-f]{40}\z') { throw 'Invalid event source SHA' }
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA) { throw 'Checkout differs from event source' }
          $status = @(git status --porcelain)
          if ($LASTEXITCODE -ne 0 -or $status.Count -ne 0) { throw 'Generator requires a clean source checkout' }
          $plan = Get-Content -LiteralPath apps/desktop/release/cloga-windows-x64.json -Raw | ConvertFrom-Json
          if ($plan.upstreamVersion -cne '0.1.6-alpha.2' -or $plan.channel -cne 'cloga-windows-x64') { throw 'Wrong source target' }
      - name: Install exact locked dependencies in approved CI
        run: pnpm install --frozen-lockfile
      - name: Generate from the combined source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($script in @('gen-scoped-events', 'gen-cordis-catalog', 'gen-doc-graphs')) {
            pnpm run $script
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          foreach ($script in @('scripts/gen-scoped-events.ts', 'scripts/gen-cordis-catalog.ts', 'scripts/gen-doc-graphs.ts')) {
            pnpm exec tsx $script --check
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Retain source-bound generated originals
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA) { throw 'Source moved during generation' }
          $tree = git rev-parse 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot bind source tree' }
          $untracked = @(git ls-files --others --exclude-standard)
          if ($LASTEXITCODE -ne 0 -or $untracked.Count -ne 0) { throw 'Unexpected nonignored untracked generator files' }
          $changed = @(git diff --name-only HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot enumerate generated changes' }
          $allowed = @(
            'packages/core/scope/src/scoped-events.generated.ts',
            'packages/extensions/tool-cordis/src/api-catalog.ts',
            'docs/capability-seams.md', 'apps/cli/composition.md',
            'docs/event-producer-consumer.md', 'docs/agent-lifecycle.md',
            'docs/tool-execution-pipeline.md', 'docs/graph-atlas.md',
            'docs/cordis-api/inherited.md', 'docs/cordis-api/context.md', 'docs/cordis-api/events.md',
            'docs/cordis-api/fiber.md', 'docs/cordis-api/registry.md', 'docs/cordis-api/service.md'
          )
          $destination = Join-Path $env:RUNNER_TEMP 'alpha2-source-generators'
          if (Test-Path -LiteralPath $destination) { throw 'Evidence directory must be new' }
          New-Item -ItemType Directory -Path $destination | Out-Null
          $outputs = @()
          foreach ($path in $changed) {
            if ($path -cnotin $allowed -and $path -cnotmatch '\Adocs/subsystems/[a-z0-9-]+(?:\.zh)?\.md\z' -and $path -cnotmatch '\Adocs/subsystems/[a-z0-9-]+\.i18n\.yaml\z') {
              throw "Unexpected generator output: $path"
            }
            $item = Get-Item -LiteralPath $path
            if ($item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'Output must be a physical regular file' }
            $target = Join-Path (Join-Path $destination 'files') $path
            New-Item -ItemType Directory -Path (Split-Path $target -Parent) -Force | Out-Null
            Copy-Item -LiteralPath $path -Destination $target
            $digest = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ((Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant() -cne $digest) { throw 'Copied output differs' }
            $outputs += [ordered]@{ path = $path; bytes = $item.Length; sha256 = $digest }
          }
          [ordered]@{
            schemaVersion = 1; scope = 'source-generation-only'; sourceCommit = $head; sourceTree = $tree
            runId = $env:GITHUB_RUN_ID; runAttempt = $env:GITHUB_RUN_ATTEMPT
            lockfileSha256 = (Get-FileHash -LiteralPath pnpm-lock.yaml -Algorithm SHA256).Hash.ToLowerInvariant()
            outputs = $outputs; releaseQualified = $false; installerExecuted = $false
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $destination 'generation.json') -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: alpha2-source-generators-${{ github.sha }}
          path: ${{ runner.temp }}/alpha2-source-generators/
          if-no-files-found: error
          retention-days: 7

# TEMPORARY: remove this file and its dedicated audit/tests before final PR approval.
# Candidate generation only. Accepted output and the final tooling-free head need review/CI.
name: Temporary source-bound manual compact snapshot generation

on:
  pull_request:
    types: [opened, reopened, synchronize, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: manual-compact-generation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    if: >-
      github.repository == 'cloga/deepseek-harness'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.head.ref == 'cloga-manual-compact-selection'
      && github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      SOURCE_REPOSITORY: ${{ github.repository }}
      SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
      SOURCE_DRAFT: ${{ github.event.pull_request.draft }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      DSH_TELEMETRY_DISABLED: '1'
      DSH_BUILD_CLIENT_PROFILE: official
      DSH_EXAMPLE_MODE: lib
      DSH_SNAPSHOT_MAX_CONCURRENCY: '1'
      DSH_OXLINT_THREADS: '2'

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
          run_install: false
          dest: ${{ runner.temp }}/manual-compact-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Check the auditor and allocate private runner evidence
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = 'github-hosted'
          test "$RUNNER_OS" = 'Linux'
          [[ "$(node --version)" =~ ^v24\.[0-9]+\.[0-9]+$ ]]
          test "$(pnpm --version)" = '11.7.0'
          node --check .github/scripts/manual-compact-generation-audit.mjs
          node --check .github/scripts/manual-compact-generation-semantic.mjs
          node --test .github/scripts/manual-compact-generation-audit.test.mjs
          evidence="$RUNNER_TEMP/manual-compact-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [[ -e "$evidence" || -L "$evidence" ]]; then echo 'Evidence path must be new'; exit 1; fi
          mkdir -m 700 "$evidence"
          printf 'SNAPSHOT_EVIDENCE=%s\n' "$evidence" >> "$GITHUB_ENV"
          printf 'NODE_COMPILE_CACHE=%s\nTMPDIR=%s\n' "$RUNNER_TEMP/manual-compact-node-cache" "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Bind exact source, lock, recipe, generator, and all tracked inputs
        id: before
        run: node .github/scripts/manual-compact-generation-audit.mjs before >> "$GITHUB_OUTPUT"

      - name: Install normal frozen dependencies and prepare the ordinary Linux sandbox
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          bash scripts/prepare-ci-bubblewrap.sh

      - name: Build normal Host and Client artifacts
        run: pnpm run build

      - name: Refresh only the manual model-selection scenario with the official writer
        id: refresh
        env:
          DSH_SNAPSHOT: refresh
        run: |
          status=0
          pnpm exec vitest run --config vitest.snapshot.config.ts snapshots/acp/acp.snapshot.ts \
            -t 'snapshot: manual-compact-model-selection matches the expected outputs' \
            --reporter=json --outputFile="$SNAPSHOT_EVIDENCE/private-refresh.json" \
            > "$SNAPSHOT_EVIDENCE/private-refresh.stdout" 2> "$SNAPSHOT_EVIDENCE/private-refresh.stderr" || status=$?
          if (( status != 0 )); then echo 'Selected snapshot refresh failed'; exit "$status"; fi

      - name: Replay the same exact scenario without expected-output updates
        id: replay
        env:
          DSH_SNAPSHOT: replay
        run: |
          status=0
          pnpm exec vitest run --config vitest.snapshot.config.ts snapshots/acp/acp.snapshot.ts \
            -t 'snapshot: manual-compact-model-selection matches the expected outputs' \
            --reporter=json --outputFile="$SNAPSHOT_EVIDENCE/private-replay.json" \
            > "$SNAPSHOT_EVIDENCE/private-replay.stdout" 2> "$SNAPSHOT_EVIDENCE/private-replay.stderr" || status=$?
          if (( status != 0 )); then echo 'Selected snapshot replay failed'; exit "$status"; fi

      - name: Verify the complete recorded-session corpus without rewriting it
        id: corpus
        env:
          DSH_SNAPSHOT: replay
        run: |
          status=0
          pnpm exec vitest run --config vitest.snapshot.config.ts scripts/session-snapshot-corpus.corpus.ts \
            --reporter=json --outputFile="$SNAPSHOT_EVIDENCE/private-corpus.json" \
            > "$SNAPSHOT_EVIDENCE/private-corpus.stdout" 2> "$SNAPSHOT_EVIDENCE/private-corpus.stderr" || status=$?
          if (( status != 0 )); then echo 'Snapshot corpus verification failed'; exit "$status"; fi
          status=0
          git diff --check > "$SNAPSHOT_EVIDENCE/private-whitespace.stdout" 2> "$SNAPSHOT_EVIDENCE/private-whitespace.stderr" || status=$?
          if (( status != 0 )); then echo 'Snapshot whitespace verification failed'; exit "$status"; fi

      - name: Verify generated semantics through the official Session decoder
        id: semantic
        run: |
          status=0
          node --import tsx/esm .github/scripts/manual-compact-generation-semantic.mjs \
            > "$SNAPSHOT_EVIDENCE/private-semantic.stdout" 2> "$SNAPSHOT_EVIDENCE/private-semantic.stderr" || status=$?
          if (( status != 0 )); then echo 'Snapshot route/lifecycle semantics rejected'; exit "$status"; fi
          if ! grep -Eq '^semantic_sha=[a-f0-9]{64}$' "$SNAPSHOT_EVIDENCE/private-semantic.stdout" \
            || [[ "$(wc -l < "$SNAPSHOT_EVIDENCE/private-semantic.stdout")" -ne 1 ]]; then
            echo 'Semantic receipt identity rejected'; exit 1
          fi
          cat "$SNAPSHOT_EVIDENCE/private-semantic.stdout" >> "$GITHUB_OUTPUT"

      - name: Audit four outputs and reject every other input change
        id: audit
        if: always() && steps.before.outcome == 'success'
        env:
          EXPECTED_STATE_SHA: ${{ steps.before.outputs.state_sha }}
          EXPECTED_SEMANTIC_SHA: ${{ steps.semantic.outputs.semantic_sha }}
          SEMANTIC_OUTCOME: ${{ steps.semantic.outcome }}
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
          REPLAY_OUTCOME: ${{ steps.replay.outcome }}
          CORPUS_OUTCOME: ${{ steps.corpus.outcome }}
        run: |
          set -euo pipefail
          # Run the bound pre-generation auditor, not a possibly changed worktree script.
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { lstatSync, readFileSync } from 'node:fs';
          import { dirname, join } from 'node:path';
          try {
            const hash = b => createHash('sha256').update(b).digest('hex');
            const safe = p => { const parent = dirname(p); if (parent !== p) safe(parent); if (lstatSync(p).isSymbolicLink()) throw new Error(); };
            const statePath = join(process.env.SNAPSHOT_EVIDENCE, 'private-state.json');
            const auditPath = join(process.env.SNAPSHOT_EVIDENCE, 'private-audit.mjs');
            safe(statePath); safe(auditPath);
            const bytes = readFileSync(statePath);
            if (hash(bytes) !== process.env.EXPECTED_STATE_SHA) throw new Error();
            const expected = JSON.parse(bytes).inputs.find(r => r.path === '.github/scripts/manual-compact-generation-audit.mjs').sha256;
            if (hash(readFileSync(auditPath)) !== expected) throw new Error();
          } catch { console.error('Audit checker binding rejected'); process.exit(1); }
          NODE
          node "$SNAPSHOT_EVIDENCE/private-audit.mjs" after

      - uses: actions/upload-artifact@v4
        if: success() && steps.audit.outcome == 'success'
        with:
          name: manual-compact-generation-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: |
            ${{ env.SNAPSHOT_EVIDENCE }}/upload/inputs.json
            ${{ env.SNAPSHOT_EVIDENCE }}/upload/qualified.json
            ${{ env.SNAPSHOT_EVIDENCE }}/upload/generated/snapshots/acp/manual-compact-model-selection/session.v3.jsonl
            ${{ env.SNAPSHOT_EVIDENCE }}/upload/generated/snapshots/acp/manual-compact-model-selection/stdout.expected.jsonl
            ${{ env.SNAPSHOT_EVIDENCE }}/upload/generated/snapshots/acp/manual-compact-model-selection/system-prompt.expected.md
            ${{ env.SNAPSHOT_EVIDENCE }}/upload/generated/snapshots/acp/manual-compact-model-selection/tool-schemas.expected.json
          if-no-files-found: error
          retention-days: 7
